<!-- ════════════════════════════════════════════════════════════
     VGN TEXT TEMPLATE — a text-based game template for the
     Video Game Network, running on the green monochrome CRT.
     ────────────────────────────────────────────────────────────
     The GAME lives in main.pjs under the `vgn` list (title,
     scenes, choices, endings). This file is the ENGINE — you
     usually don't need to touch it.

     Controls: press 1-9 to take an action, ↑/↓ to highlight
     and ENTER to select, SPACE to continue, P/ESC to open the
     pause menu. Gamepad: A/B/X/Y = 1-4, START = ENTER,
     SELECT = pause, d-pad moves the highlight.

     VGN shell (ported from vgn-generic-template): CRT power-on
     boot sequence, coin bar footer with back-to-hub link, high
     scores, pause menu, modal How-to-Play, chiptune music.
     ════════════════════════════════════════════════════════════ -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%2333ff66'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --bezel: clamp(38px, 7vw, 84px);      /* top/bottom frame thickness */
    --bezel-sides: clamp(30px, 5vw, 58px); /* side frame thickness       */
    --aspect: 4 / 3;                       /* screen shape                */
    --neon:#25d7fd; --pink:#ff2bd6; --gold:#ffd319; --green:#3ddc84; --red:#ff5a3c;
    --pix:'Press Start 2P',monospace;
    --term:'VT323',monospace;
    /* green-phosphor palette */
    --ph:#39ff6e; --ph-dim:#1f9c46; --ph-dark:#0a3d1c; --ph-bg:#02100a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#07090f;color:#dce6f0;font-family:var(--term);font-size:1.2rem;
    text-align:left;overflow:hidden;display:flex;align-items:center;justify-content:center;
    padding-bottom:28px; /* leave room for the VGN coin bar */
    background-image:
      radial-gradient(1000px 600px at 82% -10%, rgba(57,255,110,.05), transparent 60%),
      radial-gradient(900px 620px at 8% 110%, rgba(37,215,253,.05), transparent 60%);
    -webkit-tap-highlight-color:transparent;
  }

  /* ══ THE MONITOR ══ */
  .monitor{
    position:relative;width:min(94vw, 1060px, calc((100svh - 225px) * 1.334)); /* auto-fits the viewport */
    padding:var(--bezel) var(--bezel-sides) calc(var(--bezel) * 1.45);
    border-radius:30px;
    background:linear-gradient(168deg,#202a38 0%,#0d1219 40%,#0a0e14 62%,#1a222e 100%);
    box-shadow:0 46px 100px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.07), inset 0 -2px 0 rgba(0,0,0,.75);
  }
  .monitor::before{ /* glass reflection over the whole bezel */
    content:"";position:absolute;inset:0;border-radius:30px;pointer-events:none;z-index:6;
    background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 26%, transparent 38%);
  }
  .screen-wrap{
    position:relative;width:100%;aspect-ratio:var(--aspect);border-radius:16px;overflow:hidden;
    background:#010803;
    box-shadow:inset 0 0 0 2px rgba(57,255,110,.06), inset 0 0 70px rgba(0,0,0,.9), 0 2px 0 rgba(0,0,0,.8);
  }
  #screen{position:absolute;inset:0;z-index:1}

  .screen-glow{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(125% 105% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%),
               radial-gradient(70% 60% at 50% 40%, rgba(30,255,110,.05), transparent 70%);} /* tube curvature + phosphor tint */
  .screen-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
    background:linear-gradient(115deg, transparent 42%, rgba(170,255,190,.06) 47%, transparent 53%);
    animation:sheen 8s ease-in-out infinite;}
  @keyframes sheen{0%,58%,100%{transform:translateX(-45%)}74%{transform:translateX(45%)}}
  .scanlines{position:absolute;inset:0;z-index:30;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 1px, transparent 1px 3px);}
  .crt-flicker{position:absolute;inset:0;z-index:31;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background:rgba(255,255,255,.02);animation:flicker 4s infinite;}
  @keyframes flicker{0%,100%{opacity:.45}49%{opacity:.5}50%{opacity:.32}51%{opacity:.5}}

  /* key hints (top-left of screen) */
  .hints{
    position:absolute;top:12px;left:12px;z-index:7;display:none;
    font-family:var(--term);font-size:1rem;line-height:1.5;color:#9fe8b4;
    background:rgba(2,16,10,.7);border:1px solid rgba(57,255,110,.18);border-radius:8px;padding:6px 10px;
    pointer-events:none;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;
  }
  .hints.on{display:block}

  /* ══ ON-SCREEN GAMEPAD ══ */
  .gamepad{
    position:absolute;left:0;right:0;bottom:12px;z-index:8;
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 14px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .gamepad.on{opacity:1;pointer-events:auto}
  .pad-group{
    display:flex;gap:14px;align-items:center;padding:10px 12px;border-radius:14px;
    background:rgba(7,9,15,.62);border:1px solid rgba(120,140,180,.22);backdrop-filter:blur(3px);
  }
  .dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}
  .d{
    grid-area:2/2;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;
    background:linear-gradient(180deg,#1b2534,#0f1622);border:1px solid rgba(120,140,180,.25);
    color:#8a93a5;font-size:1.05rem;border-radius:6px;transition:all .12s;
  }
  .d.up{grid-area:1/2}.d.down{grid-area:3/2}.d.left{grid-area:2/1}.d.right{grid-area:2/3}
  .d.on{background:linear-gradient(180deg,#ffe25e,#ffd319);color:#07090f;border-color:transparent;box-shadow:0 0 16px rgba(255,211,25,.5)}
  .pad-mid{display:flex;flex-direction:column;gap:8px;align-items:center}
  .pmin{
    font-family:var(--pix);font-size:.38rem;letter-spacing:.06em;color:#8a93a5;padding:7px 9px;cursor:pointer;
    background:#0f1622;border:1px solid rgba(120,140,180,.25);border-radius:6px;user-select:none;touch-action:none;transition:all .12s;
  }
  .pmin.on{background:#25d7fd;color:#07090f;border-color:transparent;box-shadow:0 0 14px rgba(37,215,253,.5)}
  .btns{display:grid;grid-template-columns:repeat(2,44px);gap:7px}
  .pbtn{
    width:44px;height:44px;border-radius:50%;cursor:pointer;user-select:none;touch-action:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);font-size:.6rem;color:#fff;border:1px solid rgba(255,255,255,.22);
    box-shadow:0 3px 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);transition:all .12s;
  }
  .pbtn.a{background:linear-gradient(180deg,#3ddc84,#1e8a52)}
  .pbtn.b{background:linear-gradient(180deg,#ff6b4a,#c0392b)}
  .pbtn.x{background:linear-gradient(180deg,#37b6ff,#1d6fb8)}
  .pbtn.y{background:linear-gradient(180deg,#ffd319,#d49a00)}
  .pbtn.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,255,255,.35);filter:brightness(1.25)}
  @media(max-width:560px){
    .dpad{grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}
    .pbtn{width:38px;height:38px}
    .pad-group{gap:9px;padding:8px 9px}
  }

  /* ══ BEZEL CONTROL PANEL (bottom of the monitor) ══ */
  .panel{
    position:absolute;left:var(--bezel-sides);right:var(--bezel-sides);bottom:calc(var(--bezel)*.32);z-index:6;
    display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  }
  .brand{font-family:var(--pix);font-size:.5rem;letter-spacing:.18em;color:var(--neon);text-shadow:0 0 10px rgba(37,215,253,.6)}
  .led{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.9);animation:ledpulse 3.2s ease-in-out infinite}
  @keyframes ledpulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* ══ BARE MODE (bezel off — fullscreen game) ══ */
  body.bare{overflow:hidden}
  body.bare .monitor{width:100vw;height:100vh;max-width:none;padding:0;border-radius:0;box-shadow:none}
  body.bare .panel,body.bare .monitor::before{display:none}
  body.bare .screen-wrap{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
  body.bare .screen-wrap{box-shadow:none}

  /* ══════════════════════════════════════════════════════════
     GREEN MONOCHROME TERMINAL
     ══════════════════════════════════════════════════════════ */
  [hidden]{ display:none !important; }

  #screen{
    font-family:var(--term);
    font-size:clamp(14px, 1.85vmin, 20px);
    color:var(--ph); background:var(--ph-bg);
    overflow-y:auto; text-transform:uppercase; text-align:left;
    text-shadow:0 0 6px rgba(57,255,110,.5); letter-spacing:.04em; line-height:1.34;
  }
  #screen::-webkit-scrollbar{ width:9px; background:#02100a; }
  #screen::-webkit-scrollbar-thumb{ background:#0a3d1c; border-radius:5px; }

  .term{ max-width:760px; margin:0 auto; min-height:100%; }
  #gameScreen{ height:100%; display:flex; flex-direction:column; }
  #out{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 22px 6px; }
  #promptLine{ flex:none; padding:4px 22px 2px; }
  #keypad{ flex:none; margin:8px 22px 2px; }
  #gameScreen .tbtnrow{ flex:none; padding:8px 22px 18px; }

  .l{ white-space:pre-wrap; word-break:break-word; }
  .l.dim{ color:var(--ph-dim); text-shadow:none; }
  .l.hero{ color:var(--ph); }
  .l.bad{ color:#ffb3b3; text-shadow:0 0 8px rgba(255,80,80,.5); }
  .l.good{ text-shadow:0 0 9px rgba(57,255,110,.8); }
  .l.big{ font-size:1.7em; line-height:1.2; }
  .l.art{ color:var(--ph-dim); text-shadow:none; }
  .l.status{ color:var(--ph-dim); text-shadow:none; border-bottom:1px solid rgba(57,255,110,.15); padding-bottom:4px; margin-bottom:6px; }

  #promptLine{ white-space:pre-wrap; min-height:1.2em; }
  #promptLine::after{ content:"█"; color:var(--ph); animation:blink 1.05s steps(1) infinite; }
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:0}}

  .waitHint{ color:var(--ph-dim); text-shadow:none; animation:softblink 1.3s ease-in-out infinite; }
  @keyframes softblink{0%,100%{opacity:1}50%{opacity:.35}}

  /* terminal buttons */
  .tbtnrow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center; }
  button{
    font-family:var(--term); font-size:1.05em; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ph); background:transparent; border:1px solid var(--ph-dim); border-radius:6px;
    padding:9px 16px; cursor:pointer; text-shadow:0 0 6px rgba(57,255,110,.4);
  }
  button:hover{ background:rgba(57,255,110,.12); border-color:var(--ph); }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--ph-dark); border-color:var(--ph); box-shadow:0 0 14px rgba(57,255,110,.25); }
  button.primary:hover{ background:#0e5a2a; }
  button.danger{ border-color:#ff6b6b; color:#ffb3b3; }

  /* on-screen keypad */
  #keypad{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; max-width:340px; }
  #keypad button{ flex:1 1 30px; min-width:44px; padding:7px 6px; font-size:1.1em; }
  #keypad button.kok{ flex:2 1 68px; }

  /* title screen */
  #titleScreen{ min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px; }
  .tTitle{ margin:0; font-size:clamp(20px, 3.5vmin, 42px); line-height:1.1; letter-spacing:.08em; color:var(--ph); text-shadow:0 0 14px rgba(57,255,110,.6); text-align:center; white-space:pre; overflow:visible; flex-shrink:0; }
  .tArt{ margin:0; color:var(--ph-dim); white-space:pre; text-align:center; line-height:1.15; overflow:visible; flex-shrink:0; }
  .tSub{ color:var(--ph); text-align:center; font-size:.92em; }
  .tSub .dim{ color:var(--ph-dim); text-shadow:none; }
  .tMenu{ display:flex; flex-direction:column; gap:7px; margin-top:10px; align-items:center; }
  .tMenu button{ min-width:210px; font-size:1em; padding:7px 14px; }
  .tCred{ margin-top:8px; font-size:.85em; color:var(--ph-dim); text-shadow:none; text-align:center; display:flex; flex-direction:column; gap:4px; }
  .tCred .hiScore{ color:var(--ph); text-shadow:0 0 8px rgba(57,255,110,.55); letter-spacing:.1em; }
  .blink{ animation:blink 1.05s steps(1) infinite; }

  /* end screen */
  #endScreen{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; }
  #endCtn{ max-width:760px; width:100%; }
  #endBtns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; justify-content:center; }

  /* VGN CRT adapt */
  .monitor{ width:min(94vw, 1060px, calc((100svh - 190px) * 1.334)); }
  .monitor > .panel{ padding:0; margin:0; background:transparent; border:none; border-radius:0; box-shadow:none; }
  .ctrl-panel{ display:flex; gap:8px; pointer-events:auto; }
  .panel .tbtn{ font-size:.4rem; padding:6px 9px; background:rgba(7,9,15,.62); }
  body.bare .panel{
    display:flex; position:fixed; left:0; right:0; top:0; bottom:auto;
    z-index:20; padding:8px 14px; margin:0; border-radius:0;
    background:rgba(7,9,15,.55); backdrop-filter:blur(3px);
    border-bottom:1px solid rgba(120,140,180,.2);
  }
  body.bare .led{ display:none; }

  /* ══ OVERLAYS (boot / pause / how-to) — sit above the game, below scanlines ══ */
  #bootOverlay,#pauseOverlay,#howtoOverlay{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;
  }
  #bootOverlay{ background:#000; }
  #bootFlash{ position:absolute;inset:0;background:#fff;opacity:0;animation:bootFlash .5s ease-out .05s 1;pointer-events:none; }
  @keyframes bootFlash{ 0%{opacity:1} 100%{opacity:0} }
  #bootLines{
    font-family:var(--term);font-size:clamp(14px,2.2vmin,19px);color:var(--ph);
    text-shadow:0 0 6px rgba(57,255,110,.6);text-align:left;width:min(86%,520px);
    line-height:1.5;min-height:150px;white-space:pre-wrap;
  }
  #bootLines::after{ content:"▮"; animation:blink .8s steps(1) infinite; }
  #bootLogo{
    font-family:var(--pix);font-size:clamp(30px,7vmin,54px);color:var(--ph);
    letter-spacing:10px;margin:12px 0 4px;text-shadow:0 0 12px rgba(57,255,110,.9);
    animation:bootFlicker 1.3s steps(1) infinite;
  }
  @keyframes bootFlicker{ 0%,100%{opacity:1} 7%{opacity:.3} 8%{opacity:1} 42%{opacity:1} 43%{opacity:.5} 44%{opacity:1} }
  #bootFoot{ font-family:var(--term);font-size:14px;color:var(--ph-dim);margin-top:8px; }

  #pauseOverlay{ background:rgba(2,16,10,.86); }
  #pauseOverlay .p-title{ margin:0;font-size:clamp(22px,4vmin,34px);color:var(--ph);letter-spacing:.1em;text-shadow:0 0 14px rgba(57,255,110,.6); }
  #pauseOverlay .p-hint{ margin:6px 0 0;color:var(--ph-dim); }
  #pauseOverlay .p-btns{ display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px; }

  #howtoOverlay{ background:rgba(2,16,10,.96); }
  #howtoOverlay .p-title{ margin:0 0 8px;font-size:clamp(20px,3.6vmin,30px);color:var(--ph);letter-spacing:.1em;text-shadow:0 0 12px rgba(57,255,110,.6); }
  #howtoBody{ max-width:720px;width:100%;text-align:left;font-size:1.08em;line-height:1.5;white-space:pre-wrap;color:var(--ph); }
  #howtoOverlay .tbtnrow{ justify-content:center; }

  /* ══ VGN COIN BAR FOOTER (identity — keep it) ══ */
  #coinBar{
    position:fixed;left:0;right:0;bottom:0;height:28px;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;
    background:#03110a;border-top:1px solid rgba(57,255,110,.35);
    font-family:var(--term);font-size:16px;letter-spacing:1px;
  }
  #coinBar .bar-left{ color:var(--ph);text-shadow:0 0 6px rgba(57,255,110,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  #coinBar .bar-left .dot{ animation:blink 1.1s steps(1) infinite; }
  #hubLink{ color:var(--ph);text-decoration:none;text-shadow:0 0 6px rgba(57,255,110,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  #hubLink:hover{ color:#fff;text-decoration:underline; }
  #coinBar .bar-right{ color:var(--ph-dim);font-size:14px;white-space:nowrap;flex:none; }

  @media (max-width:600px){
    .term{ padding:12px 12px 60px; }
    .tMenu button{ min-width:200px; }
  }
</style>

<!-- ═══════════ MONITOR ═══════════ -->
<div class="monitor">
  <div class="screen-wrap">
    <div id="screen">

      <!-- ===================== TITLE SCREEN ===================== -->
      <div id="titleScreen" hidden>
        <div id="titleCtn"></div>
        <div class="tMenu">
          <button id="startBtn" class="primary" onclick="newGame()">▶ NEW GAME</button>
          <button id="continueBtn" onclick="continueGame()" hidden>↻ CONTINUE</button>
          <button id="howtoBtn" onclick="howToPlay()">? HOW TO PLAY</button>
        </div>
        <div class="tCred" id="titleCred"></div>
      </div>

      <!-- ===================== GAME SCREEN ===================== -->
      <div id="gameScreen" class="term" hidden>
        <div id="out"></div>
        <div id="promptLine"></div>
        <div id="keypad" hidden></div>
        <div class="tbtnrow">
          <button onclick="soundToggle()" id="muteBtn">SOUND: ON</button>
          <button onclick="quitToTitle()">✕ QUIT TO TITLE</button>
        </div>
      </div>

      <!-- ===================== END SCREEN ===================== -->
      <div id="endScreen" hidden>
        <div id="endCtn">
          <div id="endOut"></div>
          <div id="endBtns">
            <button class="primary" onclick="playAgain()">▶ PLAY AGAIN</button>
            <button onclick="backToTitle()">⇐ TITLE</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ===================== BOOT SEQUENCE ===================== -->
    <div id="bootOverlay">
      <div id="bootFlash" aria-hidden="true"></div>
      <div id="bootLines"></div>
      <div id="bootLogo">VGN</div>
      <div id="bootFoot">vgn-text-template · v1.1.0</div>
    </div>

    <!-- ===================== PAUSE MENU ===================== -->
    <div id="pauseOverlay" hidden>
      <h2 class="p-title">PAUSED</h2>
      <p class="p-hint">P / ESC TO RESUME</p>
      <div class="p-btns">
        <button class="primary" onclick="resumeGame()">▶ RESUME</button>
        <button onclick="howToPlay(true)">? HOW TO PLAY</button>
        <button onclick="restartGame()">↻ RESTART</button>
        <button onclick="quitToTitle()">✕ QUIT TO TITLE</button>
      </div>
    </div>

    <!-- ===================== HOW TO PLAY ===================== -->
    <div id="howtoOverlay" hidden>
      <h2 class="p-title">HOW TO PLAY</h2>
      <div id="howtoBody"></div>
      <div class="tbtnrow">
        <button class="primary" onclick="closeHowTo()">← BACK</button>
      </div>
    </div>

    <div class="screen-glow" aria-hidden="true"></div>
    <div class="screen-sheen" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="crt-flicker" aria-hidden="true"></div>

    <div class="hints" id="hintsEl"></div>

    <div class="gamepad" id="gamepad" aria-hidden="true">
      <div class="pad-group">
        <div class="dpad" id="dpad">
          <button class="d up" data-key="up" aria-label="Up">▲</button>
          <button class="d left" data-key="left" aria-label="Left">◀</button>
          <button class="d right" data-key="right" aria-label="Right">▶</button>
          <button class="d down" data-key="down" aria-label="Down">▼</button>
        </div>
        <div class="pad-mid">
          <button class="pmin" data-key="select" aria-label="Select">SEL</button>
          <button class="pmin" data-key="start" aria-label="Start">STA</button>
        </div>
        <div class="btns">
          <button class="pbtn y" data-key="y" aria-label="Y">Y</button>
          <button class="pbtn x" data-key="x" aria-label="X">X</button>
          <button class="pbtn b" data-key="b" aria-label="B">B</button>
          <button class="pbtn a" data-key="a" aria-label="A">A</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <span class="brand">◤ VGN ◥</span>
    <span class="ctrl-panel">
      <button class="tbtn" id="controlsBtn" aria-pressed="false">🎮 Controls</button>
      <button class="tbtn" id="bezelBtn" aria-pressed="false">⛶ Bezel</button>
      <button class="tbtn" id="fullBtn" aria-pressed="false">▣ Full</button>
    </span>
    <span class="led"></span>
  </div>
</div>

<!-- ═══════════ VGN COIN BAR FOOTER (identity — keep it) ═══════════ -->
<footer id="coinBar">

<!-- ═══════════ CRT / GAMEPAD ENGINE ═══════════ -->
<script>
(function(){
  "use strict";

  /* ── VGN helper API (games can use this) ── */
  var VGN = {
    keymap:{ up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
             a:"1", b:"2", x:"3", y:"4", start:"Enter", select:"Escape" },
    setKeymap:function(map){ for(var k in map) this.keymap[k]=map[k]; },
    press:function(action){ dispatchKey(this.keymap[action], true);  },
    release:function(action){ dispatchKey(this.keymap[action], false); },
    hints:function(text){ hintsEl.textContent = text || ""; }
  };
  window.VGN = VGN;

  function keyCode(k){
    if(k===" ") return "Space";
    if(k.length===1) return "Key"+k.toUpperCase();
    return k;
  }
  function dispatchKey(key, down){
    if(!key) return;
    document.dispatchEvent(new KeyboardEvent(down?"keydown":"keyup", {key:key, code:keyCode(key), bubbles:true}));
    reflectPad(key, down);
  }

  /* ── toggles ── */
  var hintsEl = document.getElementById("hintsEl");
  var gamepad = document.getElementById("gamepad");
  var controlsBtn = document.getElementById("controlsBtn");
  var bezelBtn = document.getElementById("bezelBtn");
  var fullBtn = document.getElementById("fullBtn");
  var controlsOn = false;

  controlsBtn.addEventListener("click", function(){
    controlsOn = !controlsOn;
    controlsBtn.classList.toggle("on", controlsOn);
    controlsBtn.setAttribute("aria-pressed", String(controlsOn));
    gamepad.classList.toggle("on", controlsOn);
    hintsEl.classList.toggle("on", controlsOn);
  });
  bezelBtn.addEventListener("click", function(){
    var bare = document.body.classList.toggle("bare");
    bezelBtn.classList.toggle("on", bare);
    bezelBtn.setAttribute("aria-pressed", String(bare));
    window.dispatchEvent(new Event("resize"));
  });

  /* ── native browser fullscreen ── */
  var prevBare = false;
  function isFS(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFullBtn(){
    var fs = isFS();
    fullBtn.classList.toggle("on", fs);
    fullBtn.setAttribute("aria-pressed", String(fs));
    if(!fs) document.body.classList.toggle("bare", prevBare);
  }
  document.addEventListener("fullscreenchange", syncFullBtn);
  document.addEventListener("webkitfullscreenchange", syncFullBtn);
  fullBtn.addEventListener("click", function(){
    if(!isFS()){
      prevBare = document.body.classList.contains("bare");
      document.body.classList.add("bare");
      var el = document.documentElement;
      var p = null;
      if(el.requestFullscreen) p = el.requestFullscreen();
      else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
      if(p && p.catch) p.catch(function(){
        document.body.classList.toggle("bare", prevBare);
        syncFullBtn();
      });
      window.dispatchEvent(new Event("resize"));
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  });

  /* ── gamepad input → real keyboard events ── */
  function wire(btn){
    var action = btn.getAttribute("data-key");
    btn.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      btn.classList.add("on");
      VGN.press(action);
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    });
    function off(e){
      if(!btn.classList.contains("on")) return;
      btn.classList.remove("on");
      VGN.release(action);
    }
    btn.addEventListener("pointerup", off);
    btn.addEventListener("pointercancel", off);
    btn.addEventListener("pointerleave", off);
  }
  document.querySelectorAll(".d,.pbtn,.pmin").forEach(wire);

  /* ── real keyboard presses light up the gamepad ── */
  function reflectPad(key, down){
    var action = null;
    for(var k in VGN.keymap){ if(VGN.keymap[k]===key) action=k; }
    if(!action) return;
    var el = document.querySelector('[data-key="'+action+'"]');
    if(el) el.classList.toggle("on", down);
  }
  window.addEventListener("keyup", function(e){ reflectPad(e.key, false); });

  /* ── default hint text ── */
  VGN.hints("1-9 / A B X Y = CHOOSE · ↑↓ + ENTER = SELECT · P / ESC = PAUSE · SPACE = CONTINUE");
})();
</script>

<!-- ═══════════ TEXT ADVENTURE ENGINE ═══════════ -->
<script>
"use strict";

/* ════════════════════════════════════════════════════════════════
   VGN TEXT TEMPLATE ENGINE
   Reads the game from root.vgn (defined in main.pjs) and runs it:
   scenes → choices → state → save/continue → endings.

   Scene config (see main.pjs for the full authoring guide):
     title, lines, choices, to, end, onEnter, status (per scene)
   Choice config:
     text, to, if, effect, once
   Author JS (in `if`/`effect`/`status`/`score`/`onEnter`) runs with the
   player state in scope:  v, inv, has(), add(), remove(), say(),
   rand(), flag(), unflag(), win(), gameover().

   VGN shell (ported from vgn-generic-template):
     • CRT power-on boot sequence (bootSeq / skipBoot)
     • coin bar footer with back-to-hub link (from vgn.backHubUrl/Label)
     • high scores — vgn.score (JS expr) evaluated at run end, best
       persisted to localStorage under vgn.highScoreKey
     • pause menu (P/ESC) with resume / how-to / restart / quit
     • modal How-to-Play overlay
     • looping chiptune music sequencer (sfx.music)
   ════════════════════════════════════════════════════════════════ */

var C = null;            // loaded game definition
var S = null;            // live game state
var muted = false;
var paused = false;      // pause menu open
var booting = false;     // boot sequence in progress
var best = 0;            // hi-score from localStorage
var choiceState = null;  // active choice input { list, sel, resolve }
var waitingKey = null, waitingRes = null;

var out, promptLine, keypadEl, muteBtn, continueBtn, titleCtn, titleCred, endOut, endBtns;

function $(id){ return document.getElementById(id); }
function print(text, cls){
  var d = document.createElement("div");
  d.className = "l" + (cls ? " " + cls : "");
  d.textContent = (text === undefined || text === null) ? "" : String(text);
  out.appendChild(d);
  scrollDown();
  return d;
}
function printLines(t){
  var arr = Array.isArray(t) ? t : String(t).split("\n");
  arr.forEach(function(l){ print(l); });
}
function scrollDown(){ if(out) out.scrollTop = out.scrollHeight; }
function err(e){
  console.error(e);
  print("⚠ SCRIPT ERROR: " + (e && e.message ? e.message : e), "bad");
}

/* ==================================================================
   1. SOUND
   ================================================================== */
var sfx = {
  ctx:null,
  init:function(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (this.ctx && this.ctx.state === "suspended"){ this.ctx.resume(); }
  },
  on:function(){ return !muted; },
  tone:function(freq, dur, type, vol, when){
    if (!this.on()) return;
    this.init();
    if (!this.ctx) return;
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol || 0.07;
    o.connect(g); g.connect(this.ctx.destination);
    var t0 = (when === undefined) ? this.ctx.currentTime : when;
    g.gain.setValueAtTime(vol || 0.07, t0);
    o.start(t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.stop(t0 + dur);
  },
  blip:function(){ this.tone(880, 0.07, "square", 0.05); },
  type:function(){ this.tone(1200, 0.03, "square", 0.03); },
  bad:function(){ this.tone(140, 0.4, "sawtooth", 0.07); },
  ding:function(){ this.tone(1040, 0.14, "square", 0.06); },
  ching:function(){ this.tone(1568, 0.09, "square", 0.06); this.tone(1175, 0.12, "square", 0.06); this.tone(880, 0.18, "square", 0.05); },
  win:function(){ this.tone(523,0.15,"square",0.07); this.tone(659,0.15,"square",0.07); this.tone(784,0.15,"square",0.07); this.tone(1047,0.4,"square",0.08); },
  /* ── looping chiptune music (lookahead scheduler) ── */
  midi:function(m){ return 440 * Math.pow(2, (m - 69) / 12); },
  music:{
    playing:false, timer:null, step:0, nextT:0, bpm:138,
    lead:[ 69,null,72,74, 76,72,76,79,  77,74,77,81,  79,76,74,71 ],
    bass:[ 45,45,45,45, 41,41,41,41,  43,43,43,43,  43,47,43,45 ],
    start:function(){
      if(this.playing) return;
      sfx.init();
      if(!sfx.ctx) return;
      this.playing = true;
      this.step = 0;
      this.nextT = sfx.ctx.currentTime + 0.08;
      this.timer = setInterval(function(){ sfx.music.tick(); }, 40);
    },
    stop:function(){
      this.playing = false;
      if(this.timer){ clearInterval(this.timer); this.timer = null; }
    },
    tick:function(){
      if(!this.playing) return;
      var stepDur = 60 / this.bpm / 2;
      while(this.nextT < sfx.ctx.currentTime + 0.15){
        var s = this.step % 16;
        var lead = this.lead[s], bass = this.bass[s];
        if(lead) sfx.tone(sfx.midi(lead), stepDur * 0.9, "square", 0.045, this.nextT);
        if(bass) sfx.tone(sfx.midi(bass), stepDur * 0.95, "triangle", 0.055, this.nextT);
        this.nextT += stepDur;
        this.step++;
      }
    }
  }
};
function soundToggle(){
  muted = !muted;
  muteBtn.textContent = "SOUND: " + (muted ? "OFF" : "ON");
  if (!muted) { sfx.ding(); ensureMusic(); }
}

/* music unlocks on the first user gesture (autoplay policy) */
function ensureMusic(){
  if(muted) return;
  sfx.init();
  sfx.music.start();
}
function unlockAudio(){
  ensureMusic();
  document.removeEventListener("pointerdown", unlockAudio);
  document.removeEventListener("keydown", unlockAudio);
}
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("keydown", unlockAudio);

/* ==================================================================
   2. PLAYER STATE & AUTHOR-JS EVALUATION
   ================================================================== */
function makeCtx(){
  return {
    v: S.v,
    inv: S.inv,
    add: function(item){ if(S.inv.indexOf(item) < 0) S.inv.push(item); },
    remove: function(item){ S.inv = S.inv.filter(function(x){ return x !== item; }); },
    has: function(item){ return S.inv.indexOf(item) >= 0; },
    say: function(text){ printLines(text); },
    rand: function(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); },
    flag: function(n){ S.v[n] = true; },
    unflag: function(n){ delete S.v[n]; },
    win: function(){ finishGame("win"); },
    gameover: function(){ finishGame("gameover"); }
  };
}
function evalCode(code, ctx, isExpr){
  if(code === null || code === undefined) return undefined;
  code = String(code).trim();
  if(!code) return undefined;
  var fn;
  try {
    fn = new Function("s", isExpr ? "with(s){ return (" + code + "); }" : "with(s){ " + code + "; }");
  } catch(e){
    err(new Error("bad JS: " + code.slice(0, 60) + " — " + e.message));
    return undefined;
  }
  try {
    return fn(ctx || makeCtx());
  } catch(e){
    err(e);
    return undefined;
  }
}

/* ==================================================================
   3. LOAD THE GAME DEFINITION FROM main.pjs
   ================================================================== */
function val(node){
  if(node === null || node === undefined) return "";
  try {
    var v = node.evaluateItem;
    return (v === null || v === undefined) ? "" : v;
  } catch(e){ return ""; }
}
function loadGame(){
  var v = root.vgn;
  if(!v) return null;
  var game = {
    title: val(v.title),
    subtitle: val(v.subtitle),
    byline: val(v.byline),
    titleArt: val(v.titleArt),
    startScene: val(v.startScene) || "start",
    promptText: val(v.promptText) || "WHAT WILL YOU DO?",
    init: val(v.init),
    status: val(v.status),
    help: val(v.help),
    backHubUrl: val(v.backHubUrl) || "https://perchance.org/vgn-video-game-network",
    backHubLabel: val(v.backHubLabel) || "RETURN TO VGN HUB",
    highScoreKey: val(v.highScoreKey) || "vgn-text-template-best",
    coinPrompt: val(v.coinPrompt) || "INSERT COIN · PRESS START",
    titleCfg: val(v.titleCfg),
    score: val(v.score),
    boot: val(v.boot),
    scenes: {}
  };
  if(v.scenes && v.scenes.selectAll){
    v.scenes.selectAll.forEach(function(sc){
      var name = sc.$text;
      var scene = {
        name: name,
        title: val(sc.title),
        lines: val(sc.lines),
        status: val(sc.status),
        onEnter: val(sc.onEnter),
        to: val(sc.to),
        end: val(sc.end),
        choices: []
      };
      if(sc.choices && sc.choices.selectAll){
        sc.choices.selectAll.forEach(function(ch){
          scene.choices.push({
            key: ch.$text,
            text: val(ch.text),
            to: val(ch.to),
            ifExpr: val(ch.if),
            effect: val(ch.effect),
            once: !!(parseFloat(val(ch.once)) || val(ch.once) === "true")
          });
        });
      }
      game.scenes[name] = scene;
    });
  }
  return game;
}
function statusText(sc){
  var expr = (sc && typeof sc.status === "string" && sc.status) ? sc.status : (C.status || "");
  if(!expr) return "";
  var t = evalCode(expr, makeCtx(), true);
  return (t === null || t === undefined) ? "" : String(t);
}
function onceKey(c){ return S.scene + "::" + (c.key || c.text); }
function visibleChoices(sc){
  if(!sc.choices || !sc.choices.length) return [];
  return sc.choices.filter(function(c){
    if(c.once && S.used[onceKey(c)]) return false;
    if(c.ifExpr){
      var ok = evalCode(c.ifExpr, makeCtx(), true);
      if(!ok) return false;
    }
    return true;
  });
}

/* ==================================================================
   4. SCREENS
   ================================================================== */
function showScreen(name){
  $("titleScreen").hidden = name !== "title";
  $("gameScreen").hidden = name !== "game";
  $("endScreen").hidden = name !== "end";
  $("bootOverlay").hidden = name !== "boot";
  $("pauseOverlay").hidden = true;
  $("howtoOverlay").hidden = true;
  if(name !== "game"){ promptLine.textContent = ""; keypadEl.hidden = true; }
}

/* ==================================================================
   4.5 BOOT SEQUENCE (CRT power-on, from vgn-generic-template)
   ================================================================== */
var BOOT_LINES_DEFAULT = [
  "VGN VIDEO GAME NETWORK",
  "CRT SIGNAL ............... OK",
  "MEMORY ................... OK",
  "AUDIO .................... OK",
  "LOADING CARTRIDGE ........ OK"
];
function bootSeq(){
  booting = true;
  var lines = (C.boot && C.boot.trim()) ? C.boot.split("\n") : BOOT_LINES_DEFAULT;
  var el = $("bootLines");
  el.textContent = "";
  showScreen("boot");
  var i = 0;
  var t = setInterval(function(){
    if(i < lines.length){
      var d = document.createElement("div");
      d.textContent = lines[i];
      el.appendChild(d);
      i++;
    } else {
      clearInterval(t);
      setTimeout(function(){ if(booting) skipBoot(); }, 800);
    }
  }, 210);
}
function skipBoot(){
  if(!booting) return;
  booting = false;
  showScreen("title");
  renderTitle();
  refreshContinueBtn();
}

/* ==================================================================
   4.6 HIGH SCORES (localStorage, key from vgn.highScoreKey)
   ================================================================== */
function loadBest(){
  try { best = parseInt(localStorage.getItem(C.highScoreKey), 10) || 0; }
  catch(e){ best = 0; }
  return best;
}
function saveBest(n){
  if(n <= best) return false;
  best = n;
  try { localStorage.setItem(C.highScoreKey, String(n)); return true; }
  catch(e){ return false; }
}
function fmtScore(n){
  n = Math.max(0, Math.floor(n || 0));
  var s = String(n);
  while(s.length < 6) s = "0" + s;
  return s;
}

/* ==================================================================
   4.7 PAUSE MENU + HOW-TO-PLAY OVERLAY (P/ESC)
   ================================================================== */
function setPaused(on){
  paused = on;
  $("pauseOverlay").hidden = !on;
  if(on) sfx.blip();
}
function resumeGame(){
  if(!paused) return;
  setPaused(false);
  sfx.blip();
}
function restartGame(){
  setPaused(false);
  newGame();
}
function howToPlay(fromPause){
  sfx.blip();
  if(fromPause){ paused = false; $("pauseOverlay").hidden = false; }
  $("howtoOverlay").hidden = false;
  var body = $("howtoBody");
  body.textContent = C.help || DEFAULT_HELP;
}
function closeHowTo(){
  $("howtoOverlay").hidden = true;
  if(paused === false && $("pauseOverlay").hidden === false){ setPaused(true); }
}

/* ==================================================================
   5. THE GAME LOOP
   ================================================================== */
async function renderScene(name){
  S.scene = name;
  out.innerHTML = "";
  keypadEl.hidden = true;
  var sc = C.scenes[name];
  if(!sc){
    err(new Error("No scene named \"" + name + "\". Scenes: " + Object.keys(C.scenes).join(", ")));
    return;
  }
  var st = statusText(sc);
  if(st) print(st, "status dim");
  if(sc.title) print(sc.title, "hero good");
  if(sc.onEnter) evalCode(sc.onEnter, makeCtx(), false);
  if(sc.lines) printLines(sc.lines);
  print("");

  var choices = visibleChoices(sc);
  if(choices.length){
    print(C.promptText, "hero");
    choices.forEach(function(c, i){ print("  " + (i + 1) + "  " + c.text); });
    buildKeypad(choices.length);
    var picked = await pickChoice(choices);
    if(picked === "quit") return;
    await applyChoice(picked);
  } else if(sc.end){
    await finishGame(sc.end);
  } else {
    var k = await pause("PRESS SPACE TO CONTINUE");
    if(k === "Escape"){ quitToTitle(); return; }
    if(sc.to) renderScene(sc.to);
    else renderScene(name);
  }
}

async function applyChoice(c){
  print("> " + c.text, "good");
  S.moves = (S.moves || 0) + 1;
  if(c.once) S.used[onceKey(c)] = true;
  evalCode(c.effect, makeCtx(), false);
  saveGame();
  if(c.to) await renderScene(c.to);
  else await renderScene(S.scene);
}

async function newGame(){
  sfx.blip();
  S = {
    scene: C.startScene,
    v: {}, inv: [], used: {}, moves: 0, phase: "game"
  };
  evalCode(C.init, makeCtx(), false);
  clearSave();
  showScreen("game");
  out = $("out");
  await renderScene(S.scene);
}

function continueGame(){
  root.kv.vgnText.get("save").then(function(saved){
    if(!saved) return;
    var d;
    try { d = JSON.parse(saved); } catch(e){ return; }
    S = {
      scene: d.scene || C.startScene,
      v: d.v || {}, inv: d.inv || [], used: d.used || {}, moves: d.moves || 0, phase: "game"
    };
    showScreen("game");
    out = $("out");
    out.innerHTML = "";
    print("WELCOME BACK, ADVENTURER.", "hero good");
    print("YOUR ADVENTURE CONTINUES.", "dim");
    print("");
    renderScene(S.scene);
  });
}

async function finishGame(kind){
  S.phase = "end";
  clearSave();
  showScreen("end");
  out = endOut;
  out.innerHTML = "";
  var sc = C.scenes[S.scene] || {};
  if(sc.title) print(sc.title, "hero good");
  print("");
  print(kind === "win" ? "★★★★★  YOU WIN  ★★★★★" : "· · ·  GAME OVER  · · ·", kind === "win" ? "big hero good" : "big bad");
  print("");
  if(sc.lines) printLines(sc.lines);
  print("");
  print("MOVES TAKEN: " + (S.moves || 0));
  var finalScore = 0;
  try {
    var scv = evalCode(C.score, makeCtx(), true);
    finalScore = Math.max(0, Math.floor(+scv || 0));
  } catch(e){}
  var isHi = saveBest(finalScore);
  print("SCORE: " + fmtScore(finalScore), "hero");
  if(isHi) print("★ NEW HIGH SCORE ★", "good");
  var st = statusText(sc);
  if(st) print(st, "status dim");
  print("");
  if(C.byline) print(C.byline, "dim");
  if(kind === "win") sfx.win(); else sfx.bad();
  endBtns.style.display = "";
  scrollDown();
}

function playAgain(){ newGame(); }
function backToTitle(){ quitToTitle(); }
function quitToTitle(){
  paused = false;
  booting = false;
  if(choiceState){
    var r = choiceState.resolve;
    choiceState = null;
    promptLine.textContent = "";
    keypadEl.hidden = true;
    if(r) r("quit");
  }
  if(waitingKey){
    var r2 = waitingRes;
    waitingKey = null; waitingRes = null;
    if(r2) r2("Escape");
  }
  if(S && S.phase !== "end") saveGame();
  S = null;
  showScreen("title");
  renderTitle();
  refreshContinueBtn();
}

/* ==================================================================
   6. CHOICE INPUT
   ================================================================== */
function pickChoice(choices){
  return new Promise(function(res){
    choiceState = { list: choices, sel: 1, resolve: res };
    renderChoicePrompt();
    sfx.blip();
  });
}
function renderChoicePrompt(){
  promptLine.textContent = "> " + choiceState.sel;
}
function confirmChoice(n){
  if(!choiceState) return;
  if(n === undefined) n = choiceState.sel;
  if(n < 1 || n > choiceState.list.length){ sfx.bad(); return; }
  var c = choiceState.list[n - 1];
  var r = choiceState.resolve;
  choiceState = null;
  promptLine.textContent = "";
  keypadEl.hidden = true;
  sfx.ding();
  r(c);
}
function handleChoiceKey(e){
  var k = e.key;
  if(/^[1-9]$/.test(k)){
    e.preventDefault();
    var n = parseInt(k, 10);
    if(n <= choiceState.list.length) confirmChoice(n);
    else sfx.bad();
  } else if(k === "ArrowUp" || k === "ArrowDown"){
    e.preventDefault();
    choiceState.sel = Math.max(1, Math.min(choiceState.list.length, choiceState.sel + (k === "ArrowUp" ? -1 : 1)));
    sfx.blip();
    renderChoicePrompt();
  } else if(k === "Enter" || k === " "){
    e.preventDefault();
    confirmChoice();
  } else if(k === "Escape" || k === "p" || k === "P"){
    e.preventDefault();
    setPaused(true);
  }
}

/* ==================================================================
   7. KEYPAD (touch) + GLOBAL KEYS
   ================================================================== */
function buildKeypad(count){
  keypadEl.innerHTML = "";
  for(var i = 1; i <= count; i++){
    (function(x){
      var b = document.createElement("button");
      b.textContent = String(x);
      b.onclick = function(){ keyTap(x); };
      keypadEl.appendChild(b);
    })(i);
  }
  var en = document.createElement("button");
  en.className = "kok primary";
  en.textContent = "ENTER";
  en.onclick = keyOk;
  keypadEl.appendChild(en);
  keypadEl.hidden = false;
}
function keyTap(n){ if(choiceState) confirmChoice(n); }
function keyOk(){ if(choiceState) confirmChoice(); }

function pause(text){
  print(text || "PRESS SPACE TO CONTINUE", "waitHint");
  return new Promise(function(res){
    waitingKey = [" ", "Enter"];
    waitingRes = res;
  });
}

document.addEventListener("keydown", function(e){
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(booting){ skipBoot(); return; }
  if(!$("howtoOverlay").hidden){
    if(e.key === "Escape" || e.key === "p" || e.key === "P" || e.key === "Enter" || e.key === " "){
      e.preventDefault();
      closeHowTo();
    }
    return;
  }
  if(paused){
    if(e.key === "Escape" || e.key === "p" || e.key === "P"){
      e.preventDefault();
      resumeGame();
    }
    return;
  }
  if(choiceState){ handleChoiceKey(e); return; }
  if(waitingKey){
    if(waitingKey.indexOf(e.key) >= 0){
      e.preventDefault();
      var k = waitingKey, r = waitingRes;
      waitingKey = null; waitingRes = null;
      r(e.key);
    } else if(e.key === "Escape" || e.key === "p" || e.key === "P"){
      e.preventDefault();
      setPaused(true);
    }
    return;
  }
  if(!S){
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      if(!continueBtn.hidden) continueGame();
      else newGame();
    }
  } else if(S.phase === "end"){
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      playAgain();
    } else if(e.key === "Escape"){
      e.preventDefault();
      quitToTitle();
    }
  }
});

   8. SAVE / CONTINUE
   ================================================================== */
function saveGame(){
  if(!S || S.phase === "end") return;
  root.kv.vgnText.set("save", JSON.stringify({
    scene: S.scene, v: S.v, inv: S.inv, used: S.used, moves: S.moves
  })).catch(function(){});
}
function clearSave(){
  try { root.kv.vgnText.delete("save"); } catch(e){}
}
function refreshContinueBtn(){
  root.kv.vgnText.get("save").then(function(s){
    continueBtn.hidden = !s;
  }).catch(function(){ continueBtn.hidden = true; });
}
