<!-- NOVA STRIKE — arena shooter built from the vgn-shooter-template -->
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#04060f; }
  body {
    text-align:left;
    font-family:'Trebuchet MS', system-ui, sans-serif;
    color:#dfe9ff;
    -webkit-user-select:none; user-select:none;
  }
  #game { position:fixed; inset:0; display:block; touch-action:none; cursor:crosshair; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px;
  }
  #hpGroup { display:flex; align-items:center; gap:8px; }
  #hpWrap { width:min(34vw,240px); height:14px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:8px; overflow:hidden; }
  #hpFill { height:100%; width:100%; background:linear-gradient(90deg,#3dff9b,#7dffb8); border-radius:8px; transition:width .15s linear; }
  #hpFill.low { background:linear-gradient(90deg,#ff5d6c,#ff9d7a); }
  #hpText { font-size:12.5px; color:#bcd2ff; min-width:50px; }

  #scoreWrap { text-align:right; }
  #scoreLabel { font-size:10px; letter-spacing:2px; color:#7c8db5; display:block; }
  #scoreEl { font-size:22px; font-weight:700; color:#fff; display:block; line-height:1.1; }
  #comboEl { display:block; font-size:14px; font-weight:800; color:#ffd166; min-height:18px; text-shadow:0 0 12px rgba(255,209,102,.6); }
  #comboEl.hide { visibility:hidden; }

  #waveEl { position:absolute; left:50%; top:12px; transform:translateX(-50%); font-size:13px; letter-spacing:3px; color:#8fd0ff; opacity:.8; }

  #bannerCtn { position:absolute; top:26%; left:0; right:0; text-align:center; pointer-events:none; }
  #bannerEl { font-size:clamp(30px,7vw,62px); font-weight:900; letter-spacing:8px; color:#fff; text-shadow:0 0 30px rgba(125,233,255,.8); }
  #bannerSub { font-size:clamp(13px,2vw,18px); color:#9fb6e8; margin-top:6px; letter-spacing:2px; }
  #bannerCtn { transition:opacity .6s ease; opacity:1; }
  #bannerCtn.bannerOff { opacity:0; }

  #toast { position:absolute; top:24%; left:0; right:0; text-align:center; font-size:18px; font-weight:800; letter-spacing:2px; color:#ffd166; text-shadow:0 0 14px rgba(255,209,102,.6); opacity:0; transition:opacity .4s; }

  #weaponWrap { position:absolute; left:50%; bottom:46px; transform:translateX(-50%); text-align:center; }
  #weaponEl { font-size:13px; letter-spacing:2px; color:#9be8ff; text-transform:uppercase; font-weight:700; }
  #wBar { width:140px; height:4px; background:rgba(255,255,255,.1); border-radius:2px; margin:4px auto 0; }
  #wFill { height:100%; width:100%; background:#9be8ff; border-radius:2px; }

  #hintEl { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:12px; color:#5d6f99; }

  #hurt, #lowhp { position:fixed; inset:0; z-index:8; pointer-events:none; opacity:0; }
  #hurt { background:radial-gradient(ellipse at center, transparent 42%, rgba(255,40,60,.55) 100%); transition:opacity .18s ease-out; }
  #hurt.on { opacity:1; transition:none; }
  #lowhp { background:radial-gradient(ellipse at center, transparent 50%, rgba(255,30,50,.45) 100%); transition:opacity .6s; }
  #lowhp.on { opacity:1; }

  .overlay {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background:radial-gradient(ellipse at center, rgba(6,10,24,.72), rgba(3,5,12,.94));
    backdrop-filter:blur(2px);
  }
  .overlay.hidden { display:none; }
  h1 { font-size:clamp(38px,9vw,82px); letter-spacing:10px; font-weight:900; color:#fff; }
  h1 span { color:#7de9ff; }
  h2 { font-size:clamp(32px,7vw,60px); letter-spacing:8px; font-weight:900; color:#ff5d6c; text-shadow:0 0 30px rgba(255,93,108,.5); }
  .tagline { color:#9fb6e8; font-size:clamp(14px,2.4vw,20px); margin:12px 0 22px; max-width:60ch; padding:0 16px; min-height:1.4em; }
  .hs { color:#ffd166; letter-spacing:2px; font-size:14px; margin-top:4px; font-weight:700; }
  .btn {
    pointer-events:auto; margin-top:18px; padding:13px 44px; font-size:17px; letter-spacing:3px; font-weight:800;
    color:#04121c; background:linear-gradient(180deg,#8df3ff,#4cc9ff); border:none; border-radius:999px;
    cursor:pointer; box-shadow:0 0 24px rgba(76,201,255,.5); text-transform:uppercase;
  }
  .btn:hover { filter:brightness(1.12); }
  .btn:active { transform:translateY(1px); }
  #controls { pointer-events:none; margin-top:34px; font-size:12.5px; color:#7183ab; letter-spacing:1px; line-height:2.1; }
  kbd { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); border-radius:4px; padding:1px 6px; font-family:inherit; font-size:11px; }
  #ovScore { font-size:26px; font-weight:800; color:#fff; margin-top:14px; }
  #ovWave { color:#9fb6e8; font-size:15px; margin-top:10px; letter-spacing:1px; }
  #ovBest { color:#bcd2ff; font-size:14px; margin-top:8px; letter-spacing:1px; }
  #ovNew { color:#3dff9b; font-size:16px; font-weight:800; margin-top:10px; letter-spacing:2px; animation:pulse 1s infinite; }
  #pause h2 { color:#8fd0ff; text-shadow:0 0 30px rgba(125,233,255,.5); }
  #pause p { color:#9fb6e8; margin-top:12px; letter-spacing:2px; font-size:14px; }
  @keyframes pulse { 50% { opacity:.5; } }
</style>

<canvas id="game"></canvas>

<div id="hud">
  <div id="topbar">
    <div id="hpGroup">
      <div id="hpWrap"><div id="hpFill"></div></div>
      <span id="hpText"></span>
    </div>
    <div id="scoreWrap">
      <span id="scoreLabel">SCORE</span>
      <span id="scoreEl">0</span>
      <span id="comboEl" class="hide"></span>
    </div>
  </div>
  <div id="waveEl"></div>
  <div id="bannerCtn"><div id="bannerEl"></div><div id="bannerSub"></div></div>
  <div id="toast"></div>
  <div id="weaponWrap"><span id="weaponEl"></span><div id="wBar"><div id="wFill"></div></div></div>
  <div id="hintEl"></div>
</div>

<div id="hurt"></div>
<div id="lowhp"></div>

<div id="menu" class="overlay">
  <h1>[title]</h1>
  <p class="tagline">[tagline]</p>
  <button id="startBtn" class="btn">Start</button>
  <p class="hs" id="hsMenuEl">HIGH SCORE 0</p>
  <div id="controls">
    <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move &nbsp;·&nbsp; mouse aim &nbsp;·&nbsp; hold mouse / <kbd>Space</kbd> to fire<br>
    <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> mute<br>
    <span id="touchCtrl" style="display:none">Touch: left half = move · right half = aim &amp; auto-fire<br></span>
    Grab power-ups. Don't get hit.
  </div>
</div>

<div id="over" class="overlay hidden">
  <h2>GAME OVER</h2>
  <p id="ovWave"></p>
  <p id="ovScore"></p>
  <p id="ovBest"></p>
  <p id="ovNew" style="display:none">NEW BEST SCORE!</p>
  <button id="againBtn" class="btn">Play Again</button>
</div>

<div id="pause" class="overlay hidden">
  <h2>PAUSED</h2>
  <p>press <kbd>P</kbd> to resume</p>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const TAU = Math.PI*2;
const clamp = (v,a,b) => v<a ? a : v>b ? b : v;
const rand = (a,b) => a + Math.random()*(b-a);
const irand = (a,b) => Math.floor(rand(a,b+1));

let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeStars();
}

let stars=[];
function makeStars(){
  stars=[];
  const n=Math.floor(W*H/7000)+20;
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.random()*H, z:Math.random()*0.75+0.25});
}
function updateStars(dt){
  for(const s of stars){
    s.y += 14*s.z*dt;
    if(s.y>H){ s.y=-2; s.x=Math.random()*W; }
  }
}
function drawStars(){
  for(const s of stars){
    ctx.globalAlpha = 0.22+0.7*s.z;
    ctx.fillStyle = s.z>0.6 ? '#cfe7ff' : '#6f86b8';
    const sz = Math.max(1, s.z*1.8);
    ctx.fillRect(s.x,s.y,sz,sz);
  }
  ctx.globalAlpha = 1;
}

const keys = new Set();
const mouse = {x:0,y:0,down:false,used:false};
const touchDevice = matchMedia('(pointer:coarse)').matches;
const touch = {move:null, aim:null};
function stickVec(s){
  const dx=s.x-s.ox, dy=s.y-s.oy, d=Math.hypot(dx,dy);
  const m=Math.min(d,64)/64;
  return {x:(dx/(d||1))*m, y:(dy/(d||1))*m, mag:m};
}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  keys.add(k);
  if(k==='m'){ toggleMute(); return; }
  if(state==='menu' && (k===' '||k==='enter')) startGame();
  else if(state==='over' && (k===' '||k==='enter'||k==='r')) startGame();
  else if(state==='playing' && (k==='p'||k==='escape')) pauseGame();
  else if(state==='paused' && (k==='p'||k==='escape')) resumeGame();
  audio();
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{ keys.clear(); mouse.down=false; });
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; mouse.used=true;
});
cvs.addEventListener('mousedown',()=>{ mouse.down=true; audio(); if(state==='menu') startGame(); });
window.addEventListener('mouseup',()=>{ mouse.down=false; });
cvs.addEventListener('contextmenu',e=>e.preventDefault());
cvs.addEventListener('touchstart',e=>{
  e.preventDefault(); audio();
  for(const t of e.changedTouches){
    if(t.clientX < W/2){ if(!touch.move) touch.move={id:t.identifier,ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY}; }
    else touch.aim={id:t.identifier,ox:t.clientX,oy:t.clientY,x:t.clientX,y:t.clientY};
  }
  if(state==='menu') startGame();
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(touch.move && t.identifier===touch.move.id){ touch.move.x=t.clientX; touch.move.y=t.clientY; }
    if(touch.aim && t.identifier===touch.aim.id){ touch.aim.x=t.clientX; touch.aim.y=t.clientY; }
  }
},{passive:false});
cvs.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(touch.move && t.identifier===touch.move.id) touch.move=null;
    if(touch.aim && t.identifier===touch.aim.id) touch.aim=null;
  }
},{passive:false});
cvs.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches){ if(touch.move&&t.identifier===touch.move.id)touch.move=null; if(touch.aim&&t.identifier===touch.aim.id)touch.aim=null; } },{passive:false});

let AC=null, master=null, muted=false;
function audio(){
  if(!AC){
    try{
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value=0.32; master.connect(AC.destination);
    }catch(e){ AC=null; }
  }
  if(AC && AC.state==='suspended') AC.resume();
}
function tone(freq,dur,type,vol,slide){
  if(!AC||muted) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,AC.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),AC.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function noise(dur,vol,freq){
  if(!AC||muted) return;
  try{
    const n=AC.createBufferSource();
    const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    n.buffer=buf;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
    const g=AC.createGain();
    g.gain.setValueAtTime(vol||0.2,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    n.connect(f); f.connect(g); g.connect(master); n.start();
  }catch(e){}
}
const sfx={
  shoot(){ tone(880,0.05,'square',0.05,330); },
  eshoot(){ tone(340,0.12,'sawtooth',0.07,180); },
  hit(){ noise(0.25,0.25,500); tone(180,0.25,'sawtooth',0.18,60); },
  explosion(size){ noise(0.3+Math.min(0.25,size*0.01),0.3,700); tone(140,0.22,'triangle',0.2,40); },
  pickup(){ tone(520,0.08,'square',0.12); setTimeout(()=>tone(780,0.1,'square',0.12),70); },
  weapon(){ tone(440,0.07,'square',0.1); setTimeout(()=>tone(660,0.07,'square',0.1),70); setTimeout(()=>tone(880,0.12,'square',0.1),140); },
  wave(){ tone(220,0.14,'triangle',0.15); setTimeout(()=>tone(330,0.16,'triangle',0.15),130); },
  combo(){ tone(600+Math.min(combo,30)*8,0.06,'square',0.08); },
  over(){ tone(400,0.2,'sawtooth',0.2,200); setTimeout(()=>tone(200,0.4,'sawtooth',0.2,80),200); }
};
function toggleMute(){ muted=!muted; }

const WEAPONS={
  blaster:{name:'Blaster',    color:'#7de9ff', rate:0.21, shots:[0],                  speed:540,  dmg:1, r:4, pierce:0,  life:1.3},
  twin:{name:'Twin Blaster',  color:'#7de9ff', rate:0.20, shots:[-0.09,0.09],         speed:580,  dmg:1, r:4, pierce:0,  life:1.3},
  scatter:{name:'Scatter',    color:'#ffd166', rate:0.38, shots:[-0.3,-0.15,0,0.15,0.3], speed:470, dmg:0.7, r:4, pierce:0, life:0.9},
  railgun:{name:'Railgun',    color:'#ff6b9d', rate:0.55, shots:[0],                  speed:1250, dmg:4, r:6, pierce:99, life:1.1},
  plasma:{name:'Plasma',      color:'#b388ff', rate:0.42, shots:[0],                  speed:560,  dmg:1, r:5, pierce:1,  life:1.0, burst:3, burstGap:0.07}
};
const ENEMY_TYPES={
  grunt:{r:16, hp:3,  speed:95,  color:'#ff5d5d', score:10, cost:1, contact:10},
  chaser:{r:13, hp:2,  speed:155, color:'#ffb84d', score:15, cost:2, contact:10},
  spitter:{r:15, hp:3, speed:58,  color:'#c77dff', score:25, cost:3, contact:8, shoot:true},
  swarmling:{r:9, hp:1, speed:180, color:'#7dffb8', score:5, cost:1, contact:5},
  tank:{r:26, hp:18, speed:36,    color:'#ff2d6f', score:40, cost:5, contact:22}
};

let state='menu';
let player=null, bullets=[], enemies=[], pickups=[], particles=[], texts=[];
let score=0, highScore=0, combo=0, comboTimer=0;
let wave=0, waveState='break', spawnQueue=[], spawnT=0, breakT=0;
let shake=0, time=0, hurtFlashT=0, bannerIdleT=0, toastT=0;
let lastT=performance.now();

function resetGame(){
  player={x:W/2,y:H/2,vx:0,vy:0,r:12,hp:100,maxHp:100,speed:270,aim:0,invuln:1.2,fireCd:0,burstLeft:0,burstCd:0,weapon:'blaster',weaponT:0,rapidT:0,thrustT:0};
  bullets=[]; enemies=[]; pickups=[]; particles=[]; texts=[];
  score=0; combo=0; comboTimer=0; wave=0; shake=0; hurtFlashT=0; bannerIdleT=0;
  waveState='break'; breakT=1.6; spawnQueue=[];
  updateHud();
}
function startGame(){
  resetGame();
  state='playing';
  $('menu').classList.add('hidden');
  $('over').classList.add('hidden');
  $('pause').classList.add('hidden');
  $('hud').style.display='block';
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function pauseGame(){ if(state!=='playing')return; state='paused'; $('pause').classList.remove('hidden'); }
function resumeGame(){ if(state!=='paused')return; state='playing'; $('pause').classList.add('hidden'); lastT=performance.now(); }
function gameOver(){
  state='over';
  sfx.over();
  shake=10;
  const isBest=score>highScore;
  if(isBest){ highScore=score; saveScore(); }
  $('ovWave').textContent='You survived wave '+wave;
  $('ovScore').textContent='SCORE  '+score.toLocaleString();
  $('ovBest').textContent='BEST  '+highScore.toLocaleString();
  $('ovNew').style.display = isBest ? 'block' : 'none';
  $('hsMenuEl').textContent='HIGH SCORE  '+highScore.toLocaleString();
  $('over').classList.remove('hidden');
  $('hud').style.display='block';
}
async function loadScore(){
  try{
    const v=await root.kv.shooter.get('high');
    if(typeof v==='number'){ highScore=v; $('hsMenuEl').textContent='HIGH SCORE  '+v.toLocaleString(); }
  }catch(e){}
}
function saveScore(){ try{ root.kv.shooter.set('high', highScore); }catch(e){} }

function showBanner(txt,sub){
  $('bannerEl').textContent=txt;
  $('bannerSub').textContent=sub||'';
  $('bannerCtn').classList.remove('bannerOff');
  bannerIdleT=2.2;
}
function weaponBanner(txt){
  $('toast').textContent=txt;
  $('toast').style.opacity=1;
  toastT=1.6;
}
function spawnEnemy(type){
  const t=ENEMY_TYPES[type];
  const side=irand(0,3), m=40;
  let x,y;
  if(side===0){ x=rand(0,W); y=-m; }
  else if(side===1){ x=W+m; y=rand(0,H); }
  else if(side===2){ x=rand(0,W); y=H+m; }
  else { x=-m; y=rand(0,H); }
  enemies.push({type,x,y,vx:0,vy:0,r:t.r,hp:t.hp,maxHp:t.hp,flash:0,think:rand(0,10),seed:Math.random()*TAU,fireCd:rand(1,2.5),dead:false});
}
function buildWave(n){
  const pool=['grunt'];
  if(n>=2) pool.push('chaser');
  if(n>=3) pool.push('spitter');
  if(n>=4) pool.push('swarmling');
  if(n>=5) pool.push('tank');
  const q=[];
  let budget=6+n*4;
  if(n%4===0){ for(let i=0;i<6;i++) q.push('swarmling'); }
  while(budget>0){
    const ty=pool[irand(0,pool.length-1)];
    q.push(ty); budget-=ENEMY_TYPES[ty].cost;
  }
  return q;
}
function startWave(n){
  wave=n;
  spawnQueue=buildWave(n);
  waveState='spawning';
  spawnT=0.4;
  let sub='Here they come!';
  try{ sub=root.waveIntro.evaluateItem; }catch(e){}
  showBanner('WAVE '+n, sub);
  sfx.wave();
  updateHud();
}
function updateWaves(dt){
  if(waveState==='break'){
    breakT-=dt;
    if(breakT<=0) startWave(wave+1);
  } else if(waveState==='spawning'){
    spawnT-=dt;
    if(spawnT<=0){
      if(spawnQueue.length){
        spawnEnemy(spawnQueue.shift());
        spawnT=Math.max(0.18, 0.85-wave*0.035);
      } else waveState='active';
    }
  } else {
    if(enemies.length===0){ waveState='break'; breakT=2.8; }
  }
}

function spawnBullet(a,w){
  const spd=w.speed*(player.rapidT>0?1.05:1);
  bullets.push({x:player.x+Math.cos(a)*(player.r+6), y:player.y+Math.sin(a)*(player.r+6),
    vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:w.r, dmg:w.dmg, pierce:w.pierce, life:w.life,
    color:w.color, friendly:true, dead:false});
}
function enemyBullet(x,y,a,spd){
  bullets.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:5,dmg:12,pierce:0,life:4,color:'#ff9d7a',friendly:false,dead:false});
}
function fireWeapon(w){
  const a=player.aim;
  if(w.burst){
    spawnBullet(a,w);
    player.burstLeft=w.burst-1;
    player.burstCd=w.burstGap;
  } else {
    for(const off of w.shots) spawnBullet(a+off,w);
  }
  const mx=player.x+Math.cos(a)*(player.r+10), my=player.y+Math.sin(a)*(player.r+10);
  for(let i=0;i<4;i++) addParticle(mx,my,{vx:Math.cos(a+rand(-0.4,0.4))*rand(40,220), vy:Math.sin(a+rand(-0.4,0.4))*rand(40,220), life:rand(0.08,0.16), size:rand(2,4), color:w.color, type:'spark'});
  sfx.shoot();
}
function tryFire(dt){
  const w=WEAPONS[player.weapon];
  if(player.burstLeft>0){
    player.burstCd-=dt;
    if(player.burstCd<=0){ spawnBullet(player.aim,w); player.burstLeft--; player.burstCd=w.burstGap; }
  }
  player.fireCd-=dt;
  const firing=(mouse.down&&mouse.used)||keys.has(' ')||(touch.aim!==null);
  if(firing && player.fireCd<=0){
    fireWeapon(w);
    player.fireCd=w.rate*(player.rapidT>0?0.5:1);
  }
}
function updatePlayer(dt){
  const p=player;
  let ix=0, iy=0;
  if(keys.has('w')||keys.has('arrowup')) iy-=1;
  if(keys.has('s')||keys.has('arrowdown')) iy+=1;
  if(keys.has('a')||keys.has('arrowleft')) ix-=1;
  if(keys.has('d')||keys.has('arrowright')) ix+=1;
  let hasInput=(ix!==0||iy!==0);
  if(touch.move){
    const sv=stickVec(touch.move); ix=sv.x; iy=sv.y;
    hasInput=sv.mag>0.2;
  }
  const il=Math.hypot(ix,iy)||1; ix/=il; iy/=il;
  p.vx+=ix*2600*dt; p.vy+=iy*2600*dt;
  const sp=Math.hypot(p.vx,p.vy);
  if(sp>p.speed){ p.vx*=p.speed/sp; p.vy*=p.speed/sp; }
  if(!hasInput){ p.vx*=Math.max(0,1-9*dt); p.vy*=Math.max(0,1-9*dt); }
  p.x=clamp(p.x+p.vx*dt, 18, W-18);
  p.y=clamp(p.y+p.vy*dt, 18, H-18);
  if(touch.aim){ const sv=stickVec(touch.aim); p.aim=Math.atan2(sv.y,sv.x); }
  else p.aim=Math.atan2(mouse.y-p.y, mouse.x-p.x);
  p.invuln=Math.max(0,p.invuln-dt);
  p.weaponT=Math.max(0,p.weaponT-dt);
  if(p.weaponT===0 && p.weapon!=='blaster'){ p.weapon='blaster'; weaponBanner('Blaster'); }
  p.rapidT=Math.max(0,p.rapidT-dt);
  if(hasInput && sp>60){
    p.thrustT-=dt;
    if(p.thrustT<=0){
      p.thrustT=0.03;
      const ba=Math.atan2(-p.vy,-p.vx);
      addParticle(p.x+Math.cos(ba)*12, p.y+Math.sin(ba)*12, {vx:Math.cos(ba)*rand(120,220)+p.vx*0.2, vy:Math.sin(ba)*rand(120,220)+p.vy*0.2, life:rand(0.18,0.3), size:rand(2,4), color:Math.random()<0.5?'#4cc9ff':'#ffd166', type:'spark'});
    }
  }
  tryFire(dt);
}

function updateEnemies(dt){
  for(const e of enemies){
    e.flash=Math.max(0,e.flash-dt);
    e.think+=dt;
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    const ux=dx/d, uy=dy/d;
    const t=ENEMY_TYPES[e.type];
    if(e.type==='grunt'){ e.vx=ux*t.speed; e.vy=uy*t.speed; }
    else if(e.type==='chaser'){
      const wob=Math.sin(e.think*3+e.seed)*0.9;
      e.vx=ux*t.speed - uy*wob*70; e.vy=uy*t.speed + ux*wob*70;
    }
    else if(e.type==='swarmling'){
      e.vx=ux*t.speed+Math.sin(e.think*9+e.seed)*30;
      e.vy=uy*t.speed+Math.cos(e.think*9+e.seed)*30;
    }
    else if(e.type==='spitter'){
      const want = d>240 ? 1 : d<170 ? 0 : 0.3;
      e.vx=ux*t.speed*want; e.vy=uy*t.speed*want;
      e.fireCd-=dt;
      if(e.fireCd<=0 && d<520){
        e.fireCd=2.1+Math.random();
        const a=Math.atan2(player.y-e.y, player.x-e.x)+(Math.random()-0.5)*0.12;
        enemyBullet(e.x,e.y,a,240);
        sfx.eshoot();
      }
    }
    else if(e.type==='tank'){ e.vx=ux*t.speed; e.vy=uy*t.speed; }
    e.x=clamp(e.x+e.vx*dt, -30, W+30);
    e.y=clamp(e.y+e.vy*dt, -30, H+30);
  }
  for(let i=0;i<enemies.length;i++){
    for(let j=i+1;j<enemies.length;j++){
      const a=enemies[i], b=enemies[j];
      const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
      if(d2<rr*rr && d2>0.0001){
        const d=Math.sqrt(d2), push=(rr-d)/d*0.5;
        const ox=dx*push, oy=dy*push;
        a.x-=ox; a.y-=oy; b.x+=ox; b.y+=oy;
      }
    }
  }
  for(const e of enemies){
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    if(d < e.r+player.r-4 && player.invuln<=0){
      hurtPlayer(ENEMY_TYPES[e.type].contact, dx/d, dy/d);
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateBullets(dt){
  for(const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0 || b.x<-50 || b.x>W+50 || b.y<-50 || b.y>H+50) b.dead=true;
  }
  for(const b of bullets){
    if(b.dead || !b.friendly) continue;
    for(const e of enemies){
      if(e.dead) continue;
      const dx=b.x-e.x, dy=b.y-e.y, rr=b.r+e.r;
      if(dx*dx+dy*dy < rr*rr){
        e.hp-=b.dmg; e.flash=0.09;
        for(let i=0;i<3;i++) addParticle(b.x,b.y,{vx:rand(-120,120),vy:rand(-120,120),life:rand(0.15,0.3),size:rand(1.5,3),color:b.color,type:'spark'});
        if(e.hp<=0) killEnemy(e);
        if(b.pierce>0) b.pierce--;
        else { b.dead=true; break; }
      }
    }
  }
  if(player.invuln<=0){
    for(const b of bullets){
      if(b.dead || b.friendly) continue;
      const dx=b.x-player.x, dy=b.y-player.y, rr=b.r+player.r;
      if(dx*dx+dy*dy < rr*rr){ b.dead=true; hurtPlayer(b.dmg, -b.vx, -b.vy); }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
}
function killEnemy(e){
  e.dead=true;
  const t=ENEMY_TYPES[e.type];
  comboTimer=2.0; combo++;
  const mult=1+Math.min(4,Math.floor(combo/5));
  const pts=t.score*mult;
  score+=pts;
  if(mult>1) sfx.combo();
  addText(e.x,e.y,'+'+pts+(mult>1?' x'+mult:''), mult>1?'#ffd166':'#cfe7ff');
  addExplosion(e.x,e.y,e.r,t.color);
  shake=Math.min(shake+2,12);
  sfx.explosion(e.r);
  if(Math.random()<0.09) spawnPickup(e.x,e.y,pickKind());
}
function hurtPlayer(dmg,nx,ny){
  if(player.invuln>0) return;
  player.hp-=dmg;
  player.invuln=0.9;
  const l=Math.hypot(nx,ny)||1;
  player.vx+=nx/l*220; player.vy+=ny/l*220;
  shake=Math.min(shake+7,16);
  hurtFlashT=0.3;
  addExplosion(player.x,player.y,player.r,'#ff5d6c');
  sfx.hit();
  if(player.hp<=0){ player.hp=0; gameOver(); }
}

const PICKUP_DEF={
  heal:{color:'#3dff9b', icon:'+'},
  weapon:{color:'#ffd166', icon:'\u2726'},
  rapid:{color:'#ff8b3d', icon:'\u00BB'}
};
function pickKind(){
  const r=Math.random();
  if(r<0.32) return 'heal';
  if(r<0.68) return 'weapon';
  return 'rapid';
}
function spawnPickup(x,y,kind){ pickups.push({x,y,kind,t:0,life:12}); }
function updatePickups(dt){
  for(const pk of pickups){
    pk.t+=dt; pk.life-=dt;
    if(pk.life<=0){ pk.dead=true; continue; }
    const dx=player.x-pk.x, dy=player.y-pk.y, d=Math.hypot(dx,dy);
    if(d<70 && d>1){
      const pull=(1-d/70)*260*dt;
      pk.x+=dx/d*pull; pk.y+=dy/d*pull;
    }
    if(d<player.r+14){ pk.dead=true; applyPickup(pk.kind); }
  }
  pickups=pickups.filter(p=>!p.dead);
}
function applyPickup(kind){
  const def=PICKUP_DEF[kind];
  if(kind==='heal'){
    const healAmt=28;
    player.hp=Math.min(player.maxHp, player.hp+healAmt);
    addText(player.x,player.y-18,'+'+healAmt+' HP','#3dff9b');
    sfx.pickup();
  } else if(kind==='weapon'){
    const names=Object.keys(WEAPONS).filter(n=>n!==player.weapon);
    const next=names[irand(0,names.length-1)];
    player.weapon=next; player.weaponT=10;
    weaponBanner(WEAPONS[next].name+' equipped');
    sfx.weapon();
  } else {
    player.rapidT=8;
    weaponBanner('RAPID FIRE');
    sfx.weapon();
  }
  for(let i=0;i<10;i++) addParticle(player.x,player.y,{vx:Math.cos(i/10*TAU)*rand(80,200), vy:Math.sin(i/10*TAU)*rand(80,200), life:rand(0.2,0.4), size:rand(2,4), color:def.color, type:'spark'});
}

function addParticle(x,y,o){
  if(particles.length>500) particles.shift();
  const p=Object.assign({x,y},o);
  p.max=p.life;
  particles.push(p);
}
function addExplosion(x,y,r,color){
  const n=Math.min(26, 8+Math.round(r));
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, sp=rand(40,140+r*4);
    addParticle(x,y,{vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rand(0.3,0.7), size:rand(2,5), color, type:'spark'});
  }
  addParticle(x,y,{vx:0,vy:0,life:0.35,size:r*2.4,color:'#ffffff',type:'ring'});
  addParticle(x,y,{vx:0,vy:0,life:0.5,size:r*1.4,color,type:'glow'});
}
function addText(x,y,txt,color){ texts.push({x,y,txt,color,life:1.0,vy:-40}); }
function updateParticles(dt){
  for(const pt of particles){
    pt.life-=dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    pt.vx*=Math.max(0,1-3*dt); pt.vy*=Math.max(0,1-3*dt);
  }
  particles=particles.filter(p=>p.life>0);
  for(const t of texts){ t.life-=dt; t.y+=t.vy*dt; }
  texts=texts.filter(t=>t.life>0);
}
function drawParticles(){
  for(const pt of particles){
    const a=clamp(pt.life/(pt.max||0.5),0,1);
    if(pt.type==='ring'){
      ctx.globalAlpha=a*0.9;
      ctx.strokeStyle=pt.color; ctx.lineWidth=3*a+1;
      ctx.beginPath(); ctx.arc(pt.x,pt.y, pt.size+(1-a)*70, 0, TAU); ctx.stroke();
    } else if(pt.type==='glow'){
      ctx.globalAlpha=a*0.5;
      const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.size);
      g.addColorStop(0,pt.color); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.size,0,TAU); ctx.fill();
    } else {
      ctx.globalAlpha=a;
      ctx.fillStyle=pt.color;
      ctx.beginPath(); ctx.arc(pt.x,pt.y, Math.max(0.5,pt.size*a), 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.font='bold 14px sans-serif';
  for(const t of texts){
    ctx.globalAlpha=clamp(t.life,0,1);
    ctx.fillStyle=t.color;
    ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha=1;
}

function update(dt){
  if(state!=='playing') return;
  time+=dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updatePickups(dt);
  updateWaves(dt);
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }
  updateParticles(dt);
  shake*=Math.exp(-6*dt);
  if(shake<0.05) shake=0;
  if(bannerIdleT>0){ bannerIdleT-=dt; if(bannerIdleT<=0) $('bannerCtn').classList.add('bannerOff'); }
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  if(hurtFlashT>0){ hurtFlashT-=dt; $('hurt').classList.add('on'); if(hurtFlashT<=0) $('hurt').classList.remove('on'); }
  $('lowhp').classList.toggle('on', player.hp/player.maxHp<0.3);
  updateHud();
}
function updateHud(){
  const p=player;
  if(!p) return;
  $('hpFill').style.width=(p.hp/p.maxHp*100)+'%';
  $('hpFill').classList.toggle('low', p.hp/p.maxHp<0.35);
  $('hpText').textContent=Math.ceil(p.hp)+' / '+p.maxHp;
  $('scoreEl').textContent=score.toLocaleString();
  $('waveEl').textContent='WAVE '+wave;
  const mult=1+Math.min(4,Math.floor(combo/5));
  const ce=$('comboEl');
  if(mult>1 && comboTimer>0){ ce.classList.remove('hide'); ce.textContent='x'+mult+'  COMBO'; }
  else ce.classList.add('hide');
  $('weaponEl').textContent=WEAPONS[p.weapon].name;
  $('wFill').style.width=(p.weaponT>0 ? (p.weaponT/10*100) : 100)+'%';
}

function drawPlayer(){
  const p=player;
  if(!p || p.hp<=0) return;
  const blink=p.invuln>0 && Math.floor(time*18)%2===0;
  if(blink) return;
  ctx.save();
  ctx.translate(p.x,p.y); ctx.rotate(p.aim);
  ctx.shadowColor='#4cc9ff'; ctx.shadowBlur=18;
  ctx.fillStyle='#dff6ff';
  ctx.beginPath();
  ctx.moveTo(17,0); ctx.lineTo(-11,10); ctx.lineTo(-6,0); ctx.lineTo(-11,-10);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#4cc9ff';
  ctx.beginPath(); ctx.arc(4,0,4.5,0,TAU); ctx.fill();
  const fl=0.7+Math.random()*0.6;
  ctx.fillStyle='rgba(255,209,102,'+fl.toFixed(2)+')';
  ctx.beginPath(); ctx.moveTo(-6,4); ctx.lineTo(-6-10*fl,0); ctx.lineTo(-6,-4); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawEnemies(){
  for(const e of enemies){
    const t=ENEMY_TYPES[e.type];
    ctx.save();
    ctx.translate(e.x,e.y);
    if(e.flash>0){
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.shadowColor=t.color; ctx.shadowBlur=12;
    ctx.fillStyle=t.color;
    ctx.beginPath(); ctx.arc(0,0,e.r,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(10,18,38,0.75)';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.5,0,TAU); ctx.fill();
    if(e.type==='spitter'){
      const a=Math.atan2(player.y-e.y, player.x-e.x);
      ctx.fillStyle='#ffe066';
      ctx.beginPath(); ctx.arc(Math.cos(a)*e.r*0.35, Math.sin(a)*e.r*0.35, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if(e.hp<e.maxHp){
      const bw=e.r*2;
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.fillRect(e.x-bw/2, e.y-e.r-10, bw, 3);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(e.x-bw/2, e.y-e.r-10, bw*(e.hp/e.maxHp), 3);
    }
  }
}
function drawBullets(){
  for(const b of bullets){
    ctx.shadowColor=b.color; ctx.shadowBlur=b.friendly?10:8;
    ctx.fillStyle=b.color;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
  }
  ctx.shadowBlur=0;
}
function drawPickups(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const pk of pickups){
    const def=PICKUP_DEF[pk.kind];
    const bob=Math.sin(pk.t*4)*3;
    const pulse=1+Math.sin(pk.t*6)*0.08;
    ctx.save();
    ctx.translate(pk.x, pk.y+bob); ctx.scale(pulse,pulse);
    ctx.shadowColor=def.color; ctx.shadowBlur=14;
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#0a1226'; ctx.font='bold 13px sans-serif';
    ctx.fillText(def.icon,0,1);
    ctx.restore();
  }
  ctx.textBaseline='alphabetic';
}
function drawCrosshair(){
  ctx.strokeStyle='rgba(125,233,255,0.7)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(mouse.x,mouse.y,7,0,TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x-12,mouse.y); ctx.lineTo(mouse.x-4,mouse.y);
  ctx.moveTo(mouse.x+4,mouse.y); ctx.lineTo(mouse.x+12,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-12); ctx.lineTo(mouse.x,mouse.y-4);
  ctx.moveTo(mouse.x,mouse.y+4); ctx.lineTo(mouse.x,mouse.y+12);
  ctx.stroke();
}
function drawTouchSticks(){
  if(!touch.move && !touch.aim) return;
  ctx.strokeStyle='rgba(125,233,255,0.35)'; ctx.lineWidth=2;
  if(touch.move){
    ctx.beginPath(); ctx.arc(touch.move.ox, touch.move.oy, 44, 0, TAU); ctx.stroke();
    const sv=stickVec(touch.move);
    ctx.fillStyle='rgba(125,233,255,0.5)';
    ctx.beginPath(); ctx.arc(touch.move.ox+sv.x*40, touch.move.oy+sv.y*40, 18, 0, TAU); ctx.fill();
  }
  if(touch.aim){
    ctx.beginPath(); ctx.arc(touch.aim.ox, touch.aim.oy, 44, 0, TAU); ctx.stroke();
    const sv=stickVec(touch.aim);
    ctx.fillStyle='rgba(255,109,157,0.5)';
    ctx.beginPath(); ctx.arc(touch.aim.ox+sv.x*40, touch.aim.oy+sv.y*40, 18, 0, TAU); ctx.fill();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, Math.max(W,H)*0.7);
  bg.addColorStop(0,'#0a1226'); bg.addColorStop(1,'#03040c');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);
  drawStars();
  const shx=(Math.random()-0.5)*shake, shy=(Math.random()-0.5)*shake;
  ctx.save();
  ctx.translate(shx,shy);
  drawPickups();
  drawEnemies();
  drawBullets();
  if(state==='playing' || state==='paused') drawPlayer();
  drawParticles();
  drawTouchSticks();
  if(mouse.used && !touchDevice && state==='playing') drawCrosshair();
  ctx.restore();
}

function loop(now){
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.05) dt=0.05;
  updateStars(dt);
  if(state==='playing') update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize',resize);
resetGame();
$('hud').style.display='none';
$('hintEl').textContent = touchDevice ? 'Left: move   ·   Right: aim & shoot' : 'WASD move   ·   Mouse aim   ·   Hold mouse / Space to fire   ·   P pause   ·   M mute';
if(touchDevice) $('touchCtrl').style.display='inline';
$('startBtn').addEventListener('click',()=>{ audio(); startGame(); });
$('againBtn').addEventListener('click',()=>{ audio(); startGame(); });
loadScore();
requestAnimationFrame(loop);

window.__nova = {
  start: startGame,
  step: dt => { update(dt); },
  draw: draw,
  p: () => player,
  bullets: () => bullets.length,
  enemies: () => enemies.map(e => ({t:e.type, hp:e.hp, x:e.x, y:e.y})),
  state: () => ({ state, wave, score, combo, enemies: enemies.length, pickups: pickups.length, hp: player ? Math.round(player.hp) : 0, weapon: player ? player.weapon : null })
};
})();
</script>
