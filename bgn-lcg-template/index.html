<script>
  /* Some preview iframes inject a <base href> pointing at the public
     perchance.org URL instead of this generator's iframe subdomain,
     which would make every relative src="src/..." 404. If the base's
     origin differs from the page's own origin, put a corrected <base>
     first so relative asset URLs resolve against this iframe. */
  (function(){
    try {
      if (document.baseURI && new URL(document.baseURI).origin !== location.origin) {
        var b = document.createElement("base");
        b.href = location.origin + location.pathname;
        if (document.head) document.head.insertBefore(b, document.head.firstChild);
      }
    } catch (e) { /* leave base as-is; harmless fallback */ }
  })();
</script>

<div id="testingBanner">IN TESTING</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
  #testingBanner{
    position:fixed;top:0;left:0;right:0;z-index:10000;text-align:center;
    background:linear-gradient(180deg,#d62828,#a4161a);
    color:#fff;font-family:var(--serif);font-weight:900;font-size:1.35rem;
    letter-spacing:.18em;padding:10px 12px;
    box-shadow:0 3px 14px rgba(0,0,0,.5);text-transform:uppercase;
    border-bottom:2px solid #7a0f12;text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  :root{
    --bg:#0a0f0d; --bg2:#0e1512; --panel:#131c17;
    --line:rgba(201,162,39,.20);
    --gold:#c9a227; --gold2:#e9cf7a; --gold3:#8a6d1c;
    --cream:#f3e9c9; --text:#e9e3d3; --muted:#9aa89b; --green:#2fae8c;
    --serif:'Cinzel',serif; --sans:'Inter',system-ui,sans-serif;
  }
  /* ── settings themes ── */
  body.theme-light{
    --bg:#f4f1e8; --bg2:#ece6d8; --panel:#e2dbc6;
    --line:rgba(138,109,28,.38);
    --gold:#a97f1a; --gold2:#8a6d1c; --gold3:#6b5515;
    --cream:#3a3424; --text:#2a2620; --muted:#6b6657; --green:#1e8a6d;
  }
  body.no-anim, body.no-anim *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
  body.theme-light{background-image:
      radial-gradient(1100px 700px at 85% -10%, rgba(30,138,109,.10), transparent 60%),
      radial-gradient(900px 640px at -12% 15%, rgba(169,127,26,.10), transparent 60%),
      linear-gradient(180deg,#f4f1e8,#ece6d8 45%,#f4f1e8)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--text); text-align:left;
    font-family:var(--sans); line-height:1.55; overflow-x:hidden;
    padding-top:48px;
    background-image:
      radial-gradient(1100px 700px at 85% -10%, rgba(47,174,140,.10), transparent 60%),
      radial-gradient(900px 640px at -12% 15%, rgba(201,162,39,.08), transparent 60%),
      linear-gradient(180deg,#0a0f0d,#0e1512 45%,#0a0f0d);
    background-attachment:fixed;
  }
  h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  .goldtext{
    background:linear-gradient(180deg,#f7e6a5 0%,var(--gold2) 40%,var(--gold) 62%,var(--gold3) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .muted{color:var(--muted)}
  .small{font-size:.8rem}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .anim-play,.anim-draw,.anim-trash,.anim-buy,.anim-empty,.anim-turn,.anim-table{animation:none!important}
    .hand-slot:hover,.supply-pile.clickable:hover,.modal-opt:hover{transform:none}
  }
</style>

<!-- ═══ GAME TABLE (Phase 3: tasks 39-40) ═══ -->
<style>
  #game{scroll-margin-top:90px}
  .game-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
  .game-controls label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
  .game-controls select{
    background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:6px;
    padding:6px 8px;font-family:var(--sans);font-size:.85rem;
  }
  .flash{color:var(--gold2);font-size:.85rem;min-height:1em}
  .btn{
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241a10;border:none;border-radius:8px;
    padding:9px 18px;font-family:var(--serif);font-weight:700;font-size:.9rem;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .1s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg,#f3e3a8,#c9a227);box-shadow:0 2px 10px rgba(201,162,39,.45)}
  .table{display:flex;flex-direction:column;gap:14px;align-items:center;padding:16px 6px 40px}
  .zone-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center;margin-bottom:6px}
  .turn-banner{
    width:100%;max-width:1180px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
  }
  .turn-who{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--gold2)}
  .turn-no{font-weight:400;font-size:.8rem;color:var(--muted)}
  .phase-pill{
    background:rgba(201,162,39,.15);border:1px solid var(--line);color:var(--gold2);
    border-radius:20px;padding:4px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;
  }
  .turn-res{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .res-item{
    background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:3px 11px;
    font-size:.78rem;color:var(--text);
  }
  .opp-strip{width:100%;max-width:1180px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .opp{
    display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;font-size:.8rem;
  }
  .opp.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .opp-name{font-family:var(--serif);font-weight:700;color:var(--cream)}
  .opp-stat{color:var(--muted)}
  .supply-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1180px}
  .supply-pile{position:relative;cursor:pointer;transition:transform .12s ease}
  .supply-pile.clickable:hover{transform:translateY(-4px)}
  .pile-count{
    position:absolute;right:-6px;bottom:-6px;min-width:26px;height:26px;border-radius:13px;
    background:var(--gold);color:#241a10;font-weight:800;display:flex;align-items:center;justify-content:center;
    padding:0 7px;font-size:.85rem;border:2px solid #241a10;
  }
  .pile-count.empty{background:#6b3428;color:#e6c9c2}
  .trash-box{max-width:1180px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%}
  .active-zone{width:100%;max-width:1180px;display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .piles-row{display:flex;gap:10px}
  .pile-card{
    width:78px;height:110px;border-radius:8px;background:#1b130c;border:2px dashed rgba(201,162,39,.55);
    color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:.72rem;text-align:center;gap:6px;font-family:var(--serif);
  }
  .pile-card b{font-size:1.3rem;font-family:var(--sans)}
  .play-area{min-height:120px;padding:10px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
  .hand-ctn{width:100%;max-width:1180px;min-height:200px}
  .hand-fan{display:flex;justify-content:center;align-items:flex-end;padding-top:26px}
  .hand-slot{margin-left:-40px;transition:transform .15s ease;position:relative;cursor:default}
  .hand-slot:first-child{margin-left:0}
  .hand-slot.clickable{cursor:pointer}
  .hand-slot:hover{transform:translateY(-24px) scale(1.13);z-index:8}
  .hand-slot:hover .dcard{box-shadow:0 14px 30px rgba(0,0,0,.55)}
  .zone-empty{color:var(--muted);font-size:.8rem;padding:10px}
  .mini-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .gameover{
    background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:22px 30px;
    text-align:center;min-width:min(90vw,340px);
  }
  .gameover h3{color:var(--gold2);margin-bottom:10px}
  .score-line{font-size:1.05rem;padding:3px 0;color:var(--text)}

  /* ── the card component ── */
  .dcard{
    position:relative;width:118px;height:166px;border-radius:8px;box-sizing:border-box;
    background:linear-gradient(180deg,#f6ecd8,#e2d2ae);border:2px solid #8a6d1c;
    box-shadow:0 3px 8px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;
    color:#241a10;font-family:var(--sans);user-select:none;flex:none;
  }
  .dcard.type-treasure{background:linear-gradient(180deg,#f9ebb0,#e6cc6e);border-color:#a8831f}
  .dcard.type-victory{background:linear-gradient(180deg,#dcefd0,#a6d497);border-color:#4e8a3a}
  .dcard.type-curse{background:linear-gradient(180deg,#e2cbea,#bc92cf);border-color:#7a4f8f}
  .dcard.type-attack{border-color:#a03a28}
  .dcard.type-reaction{border-color:#2f6fa8}
  .dcard.type-duration{border-color:#b06e2a}
  .dcard-unknown{background:#3a3a3a;color:#eee;align-items:center;justify-content:center;font-size:1.4rem}
  .dcard-cost{position:absolute;top:4px;right:5px;z-index:2;display:flex;gap:2px}
  .coin-badge{
    display:inline-flex;width:23px;height:23px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9a0,#d8a520 72%);border:1.5px solid #8a6d1c;
    color:#5c4300;font-weight:800;font-size:.85rem;align-items:center;justify-content:center;box-sizing:border-box;
  }
  .coin-badge.zero{background:radial-gradient(circle at 35% 30%,#eee,#cfcfcf 72%);color:#666;border-color:#999}
  .potion-badge{
    display:inline-flex;width:18px;height:18px;border-radius:50%;background:#4d7fb5;border:1.5px solid #1e3f5f;
    color:#fff;font-weight:800;font-size:.7rem;align-items:center;justify-content:center;box-sizing:border-box;
  }
  .debt-badge{
    display:inline-flex;width:20px;height:20px;border-radius:5px;background:#7a3b4d;border:1.5px solid #3d1622;
    color:#fff;font-weight:800;font-size:.72rem;align-items:center;justify-content:center;box-sizing:border-box;
  }
  .dcard-name{
    padding:9px 8px 1px;font-weight:800;font-size:.85rem;font-family:var(--serif);text-align:center;
    color:#241a10;line-height:1.05;text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .dcard-types{font-size:.6rem;text-align:center;text-transform:uppercase;letter-spacing:.06em;color:#5c5242;padding:2px 6px}
  .dcard-text{flex:1;font-size:.64rem;line-height:1.35;padding:6px 8px;overflow:hidden}
  .dcard-exp{font-size:.55rem;text-align:center;padding:2px;color:#7a6216;background:rgba(0,0,0,.07);text-transform:uppercase;letter-spacing:.08em}
  .dcard.mini{width:66px;height:93px;border-width:1.5px;border-radius:6px}
  .dcard.mini .dcard-name{font-size:.56rem;padding:5px 4px 0}
  .dcard.mini .dcard-types{font-size:.42rem;padding:1px 3px}
  .dcard.mini .dcard-text{font-size:.4rem;padding:3px 4px;line-height:1.3}
  .dcard.mini .dcard-exp{display:none}
  .dcard.mini .coin-badge{width:16px;height:16px;font-size:.6rem;border-width:1px}
  .dcard.mini .potion-badge,.dcard.mini .debt-badge{width:13px;height:13px;font-size:.52rem}
  .demo-row{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:6px}

  /* ── disabled states (Task 41) ── */
  .hand-slot.disabled, .supply-pile.disabled{opacity:.38;filter:grayscale(.55)}
  .supply-pile.disabled.clickable,.hand-slot.disabled{cursor:not-allowed;transform:none!important}
  .btn.disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
  .btn.disabled:hover{filter:grayscale(.4)}
  .btn-sm{padding:5px 10px;font-size:.78rem;border-radius:6px}

  /* ── modal / choice system (Task 42) ── */
  .modal-ctn{
    position:fixed;inset:0;z-index:9000;background:rgba(5,8,7,.72);backdrop-filter:blur(2px);
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;
  }
  .modal-ctn.open{display:flex}
  .modal-box{
    position:relative;background:var(--panel);border:1px solid var(--gold);border-radius:14px;
    padding:20px 22px 22px;max-width:680px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.6);
  }
  .modal-title{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--gold2);margin-bottom:6px}
  .modal-note{color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .modal-counter{font-size:.8rem;color:var(--gold2);margin:4px 0 8px}
  .modal-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
  .modal-opt{
    background:none;border:none;padding:0;cursor:pointer;border-radius:9px;transition:transform .12s ease;
  }
  .modal-opt:hover{transform:translateY(-3px)}
  .modal-opt.sel{outline:3px solid var(--gold);outline-offset:2px;transform:translateY(-3px)}
  .modal-go{display:block;margin:4px auto 0}
  .modal-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .modal-confirm-line{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 4px}
  .confirm-card{box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .modal-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
  .modal-x:hover{color:var(--gold2)}
  .sentry-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .sentry-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .sentry-btns{display:flex;gap:5px}

  /* ── card-movement animations (Task 46) ── */
  @keyframes domFlyPlay{from{transform:translateY(-38px) scale(1.14);opacity:.55}to{transform:none;opacity:1}}
  @keyframes domPopDraw{from{transform:translateY(-18px) scale(.8);opacity:0}to{transform:none;opacity:1}}
  @keyframes domFlyTrash{from{transform:translateY(-20px) rotate(-7deg);opacity:.5}to{transform:none;opacity:1}}
  @keyframes domPulseBuy{0%{transform:scale(1.09);box-shadow:0 0 0 3px rgba(201,162,39,.55)}100%{transform:none;box-shadow:none}}
  @keyframes domFadeEmpty{from{opacity:.85}to{opacity:.42}}
  @keyframes domBannerIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes domTableIn{from{opacity:0}to{opacity:1}}
  .anim-play{animation:domFlyPlay .5s ease-out}
  .anim-draw{animation:domPopDraw .45s ease-out}
  .anim-trash{animation:domFlyTrash .5s ease-out}
  .anim-buy{animation:domPulseBuy .5s ease-out}
  .anim-empty{animation:domFadeEmpty .7s ease-out forwards}
  .anim-turn{animation:domBannerIn .45s ease-out}
  .anim-table{animation:domTableIn .5s ease-out}

  /* ── expansion zone surfaces (Task 44) ── */
  .zones-row{width:100%;max-width:1180px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .zone-strip{background:var(--bg2);border:1px dashed rgba(201,162,39,.4);border-radius:10px;padding:8px 12px}
  .zone-strip.dur{border-color:rgba(176,110,42,.55)}
  .zone-strip.resv{border-color:rgba(47,111,168,.55)}
  .zone-strip.exile{border-color:rgba(154,58,40,.55)}
  .token-tray{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .token-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .token{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:3px 10px;
    font-size:.78rem;color:var(--text);
  }
  .token.zero{opacity:.5}

  /* ── live game log (Task 43) ── */
  .log-box{width:100%;max-width:1180px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .log-inner{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
  .log-line{font-size:.76rem;color:var(--muted);line-height:1.45}
  .log-line:nth-child(even){background:rgba(255,255,255,.02)}

  /* ── end-game screen (Task 45) ── */
  .gameover{
    background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:22px 26px;
    text-align:center;min-width:min(94vw,460px);
  }
  .gameover h3{color:var(--gold2);margin-bottom:8px}
  .winner-line{color:var(--cream);font-family:var(--serif);font-weight:700;font-size:1.1rem;margin-bottom:14px}
  .score-table{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
  .score-row{display:flex;gap:8px;padding:6px 8px;border-radius:6px;font-size:.82rem}
  .score-row:nth-child(even){background:rgba(255,255,255,.03)}
  .score-head{font-weight:700;color:var(--gold2);text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
  .score-cell{flex:1;text-align:left;min-width:0}
  .score-cell:nth-child(2){flex:0 0 48px}
  .score-cell:last-child{flex:0 0 40px;text-align:right;font-weight:700}
  .score-parts{color:var(--muted);font-size:.76rem}
  @media (max-width:640px){
    .dcard{width:92px;height:130px}
    .dcard-name{font-size:.72rem}
    .dcard-text{font-size:.54rem}
    .dcard-types{font-size:.52rem}
    .hand-slot{margin-left:-30px}
    .supply-grid{gap:8px}
  }

  /* ── setup screen (Task 54) ── */
  .setup-panel{
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    padding:14px 18px;display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto 14px;text-align:left;
  }
  .setup-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.9rem}
  .setup-label{font-weight:700;color:var(--gold2);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
  .setup-chk{display:inline-flex;align-items:center;gap:4px;font-size:.84rem;cursor:pointer}
  .setup-inline{font-size:.86rem}
  .setup-players{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
  .setup-player{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.86rem}
  .setup-player input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 8px;font-size:.84rem;width:150px}
  .setup-player select,.setup-row select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 6px;font-size:.84rem}
  .setup-pid{color:var(--muted);font-family:ui-monospace,monospace;font-size:.76rem}
  .setup-diff-label{color:var(--muted);font-size:.76rem}
  .setup-start{margin-top:2px}
  .setup-status{color:#d98f6b;font-size:.8rem;min-height:1em}
  .pick-label{color:var(--gold2);font-size:.82rem;font-weight:600}

  /* ── kingdom picker (Task 55) ── */
  .picker-box{max-width:920px}
  .picker-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .picker-filters input[type=search]{flex:1 1 160px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 10px;font-size:.84rem}
  .picker-filters select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.82rem}
  .picker-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:52vh;overflow-y:auto;padding:6px;margin-bottom:10px}
  .pick-cell{position:relative;background:none;border:none;padding:0;cursor:pointer;border-radius:8px;transition:transform .1s ease}
  .pick-cell:hover{transform:translateY(-3px)}
  .pick-cell.sel{outline:3px solid var(--gold);outline-offset:2px}
  .pick-tick{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#12120a;font-weight:900;font-size:.9rem;
    display:none;align-items:center;justify-content:center;
  }
  .pick-cell.sel .pick-tick{display:flex}
  .picker-extras{min-height:1.2em;font-size:.82rem;color:#d9b56b;text-align:center;margin-bottom:6px}

  /* ── card encyclopedia (Task 56) ── */
  .encyc-box{max-width:1040px}

<!-- ═══ GAME TABLE LAUNCHER (?test=cards shows the component harness) ═══ -->
<script>
  (function () {
    function isTestMode() { return /[?&]tests(?:=|\b)/.test(location.search) || location.hash === "#tests"; }
    function isCardHarness() { return /[?&]test=cards/.test(location.search); }
    try { if (typeof Dominion !== "undefined" && Dominion.ui && typeof Dominion.ui.applySettings === "function") Dominion.ui.applySettings(); } catch (e) {}
    function cardsReady() {
      return typeof Dominion !== "undefined" && Dominion.cards &&
        typeof Dominion.cards.count === "function" && Dominion.cards.count() > 0;
    }
    async function ensureCards() {
      if (cardsReady()) return;
      if (typeof Dominion === "undefined" || !Dominion.cards) throw new Error("catalog not loaded");
      await Dominion.cards.init(["base", "base-kingdom", "intrigue", "alchemy", "cornucopia", "hinterlands", "seaside", "prosperity"]);
    }
    function flash(msg) {
      const f = document.getElementById("flashEl");
      if (f) f.textContent = msg;
    }
    function resetCtn() {
      document.getElementById("gameCtn").innerHTML = '<p class="muted small">Press "Start Game" to build the table. Your hand is at the bottom — click an Action to play it (Action phase) or a Treasure; in the Buy phase click a supply pile to buy. The AI handles your opponents.</p>';
      document.getElementById("setupCtn").hidden = false;
      document.getElementById("setupCtn").innerHTML = "";
      Dominion.ui.setupPanel(document.getElementById("setupCtn"), { ensureCards: ensureCards, onStart: startGame });
      checkResume();
    }
    try { window.resetCtn = resetCtn; } catch (e) {}
    function isSoloGame(cfg) {
      return cfg.players && cfg.players.filter((p) => p.difficulty === "Human").length === 1;
    }
    function startGame(cfg) {
      const g = Dominion.engine.setup({ players: cfg.players, kingdom: cfg.kingdom, seed: cfg.seed, aiDifficulty: cfg.aiDifficulty });
      Dominion.engine.beginTurn(g, cfg.humanId);
      const solo = isSoloGame(cfg);
      if (typeof root !== "undefined" && root.kv) {
        try { root.kv.dominion.delete("game"); } catch (e) {}
      }
      Dominion.ui.mount(document.getElementById("gameCtn"), g, { humanId: cfg.humanId, onRestart: resetCtn, autosave: solo });
      document.getElementById("setupCtn").hidden = true;
      try { document.getElementById("game").scrollIntoView({ block: "start" }); } catch (e) {}
      maybeTutorial(g, cfg.humanId, solo);
      if (solo) Dominion.ui.doSave(g);
    }
    function maybeTutorial(g, humanId, solo) {
      if (!solo) return;
      let done = false;
      try { done = localStorage.getItem("dominion.tutorialDone") === "1"; } catch (e) {}
      if (!done) Dominion.ui.startOnboarding(document.getElementById("gameCtn"), g, humanId);
    }
    /* ── ?kingdom= … auto-start (Task 59) ── */
    function urlGameCfg() {
      const fromSearch = Dominion.ui.kingdomFromParams(location.search);
      const fromHash = Dominion.ui.kingdomFromParams(location.hash);
      const kingdom = fromHash.kingdom || fromSearch.kingdom;
      if (!kingdom) return null;
      const seed = fromHash.seed != null ? fromHash.seed : fromSearch.seed;
      const players = parseInt(new URLSearchParams(location.search.replace(/^[?#]/, "")).get("players") || "2", 10);
      const aiLevel = new URLSearchParams(location.search.replace(/^[?#]/, "")).get("ai") || "normal";
      const n = (Number.isFinite(players) && players >= 2 && players <= 6) ? players : 2;
      const list = [];
      for (let i = 1; i <= n; i++) list.push({ id: "p" + i, name: "Player " + i, difficulty: i === 1 ? "Human" : (["easy", "normal", "hard", "brutal"].indexOf(aiLevel) !== -1 ? aiLevel : "normal") });
      const aiDifficulty = {};
      for (const p of list) if (p.difficulty !== "Human") aiDifficulty[p.id] = p.difficulty;
      return { players: list, humanId: "p1", aiDifficulty: aiDifficulty, kingdom: kingdom, seed: seed, expansions: [] };
    }
    /* ── autosave resume (Task 60) ── */
    function checkResume() {
      const setupCtn = document.getElementById("setupCtn");
      if (typeof root === "undefined" || !root.kv || !setupCtn) return;
      root.kv.dominion.get("game").then(function (rec) {
        if (!rec || !rec.saved || !rec.saved.players || !Array.isArray(rec.saved.players)) return;
        if (document.querySelector(".resume-bar")) return;
        const g = rec.saved;
        const bar = document.createElement("div");
        bar.className = "resume-bar";
        const name = (g.turnPlayer && g.players) ? ((g.players.find(function (p) { return p.id === g.turnPlayer; }) || {}).name || "?") : "?";
        const info = document.createElement("span");
        info.textContent = "Saved solo game found — turn " + (g.turn || 1) + " (" + name + " to play), " + ((g.kingdom || []).length || "?") + " card piles. ";
        bar.appendChild(info);
        const resumeBtn = document.createElement("button");
        resumeBtn.className = "btn btn-sm";
        resumeBtn.textContent = "Resume";
        resumeBtn.addEventListener("click", function () {
          ensureCards().then(function () {
            const restored = Dominion.engine.deserialize(g);
            Dominion.ui.mount(document.getElementById("gameCtn"), restored, { humanId: rec.humanId || "p1", onRestart: resetCtn, autosave: true });
            document.getElementById("setupCtn").hidden = true;
            try { document.getElementById("game").scrollIntoView({ block: "start" }); } catch (e) {}
            bar.remove();
          }).catch(function (e) { alert("Could not resume: " + ((e && e.message) || e)); });
        });
        const discardBtn = document.createElement("button");
        discardBtn.className = "btn btn-sm";
        discardBtn.textContent = "Discard save";
        discardBtn.addEventListener("click", function () {
          root.kv.dominion.delete("game").then(function () { bar.remove(); });
        });
        bar.appendChild(resumeBtn);
        bar.appendChild(discardBtn);
        setupCtn.insertBefore(bar, setupCtn.firstChild);
      }).catch(function () { /* no save or kv unavailable — show setup normally */ });
    }
    if (isTestMode()) return;
    if (isCardHarness()) {
      ensureCards().then(function () {
        document.getElementById("gameCtn").innerHTML = "";
        Dominion.ui.demo(document.getElementById("gameCtn"));
      }).catch(function (e) {
        document.getElementById("gameCtn").textContent = "harness failed: " + ((e && e.message) || e);
      });
    } else {
      ensureCards().then(function () {
        const urlCfg = urlGameCfg();
        if (urlCfg) {
          startGame(urlCfg);
        } else {
          resetCtn();
        }
      }).catch(function (e) {
        document.getElementById("gameCtn").textContent = "catalog load failed: " + ((e && e.message) || e);
      });
    }
  })();
</script>

<!-- ═══ TEST SUITE RUNNER (?tests=1 or #tests) ═══ -->
<script>
  (function(){
    function isTestMode(){
      return /[?&]tests(?:=|\b)/.test(location.search) || location.hash === "#tests";
    }
    window.runTestSuite = async function(){
      document.body.innerHTML = "";
      var wrap = document.createElement("div");
      wrap.style.cssText = "padding:26px;font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;max-width:960px;margin:0 auto;color:#e8e2d2;background:#0a0f0d;min-height:100vh;line-height:1.6";
      wrap.innerHTML = "<h1 style='font-size:1.3rem;color:#e9cf7a;font-family:serif'>Game — Test Suite</h1><div id='tOut'>Running…</div>";
      document.body.appendChild(wrap);
      var out = wrap.querySelector("#tOut");
      var res = null;
      try {
        await Dominion.cards.init(["base", "base-kingdom", "intrigue", "alchemy", "cornucopia", "hinterlands", "seaside", "prosperity"]);
        res = await DominionTest.runAll();
        out.textContent = (res.failed ? "✗ " + res.failed + " FAILED, " : "✓ ALL ") + res.passed + " passed / " + res.total + " total";
        if (res.failed) {
          var pre = document.createElement("pre");
          pre.style.whiteSpace = "pre-wrap";
          pre.textContent = JSON.stringify(res.failures, null, 2);
          out.appendChild(pre);
        }
      } catch (e) {
        out.textContent = "Suite crashed: " + ((e && e.message) || e);
      }
      document.title = "Tests: " + (res && res.failed ? "FAIL" : "PASS");
      return res;
    };
    if (isTestMode()) window.runTestSuite();
  })();
</script>
